[package]
name = "c02-naval"
version = "1.3.0"
edition = "2021"
description = "C02 Naval : bataille navale multijoueur pour Windows (Rust, egui, WebRTC compatible PeerJS)"
publish = false

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui-phosphor = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
webrtc = "0.11"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
rfd = "0.14"
arboard = { version = "3", default-features = false, features = ["image-data"] }
cpal = "0.15"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
windows-sys = { version = "0.52", features = ["Win32_System_Power"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
