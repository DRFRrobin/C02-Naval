name: api-image
on:
  push:
    branches: [main]
    paths: ['server/**', 'Dockerfile', '.github/workflows/api-image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/drfrrobin/c02-naval-api:latest
            ghcr.io/drfrrobin/c02-naval-api:${{ github.sha }}
