name: rust-windows

# Tests de la version Rust à chaque changement ; sur un tag « vX.Y.Z-windows », compile l'exécutable
# Windows et le joint à la release du même nom (le jeu s'y met à jour tout seul).
on:
  push:
    branches: [main]
    paths: ['rust/**', '.github/workflows/rust-windows.yml']
    tags: ['v*-windows']
  pull_request:
    paths: ['rust/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Tests
        run: cargo test --release
      - name: Compilation
        run: cargo build --release
      - name: Renommer l'exécutable
        shell: bash
        run: cp target/release/c02-naval.exe C02-Naval-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: C02-Naval-windows-x64
          path: rust/C02-Naval-windows-x64.exe
      - name: Joindre à la release
        if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref_name, '-windows')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" C02-Naval-windows-x64.exe --clobber \
            || gh release create "$GITHUB_REF_NAME" C02-Naval-windows-x64.exe --title "C02 Naval ${GITHUB_REF_NAME#v}" --generate-notes
