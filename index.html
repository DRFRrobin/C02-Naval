<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050d1b">
<meta name="description" content="C02 Naval : bataille navale à deux joueurs dans le navigateur, sur PC et téléphone.">
<title>C02 Naval</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --card:rgba(12,24,42,.88); --card2:rgba(6,13,25,.72); --border:rgba(64,140,210,.22); --border2:rgba(64,140,210,.36);
  --text:#e8f1fb; --muted:#8ea3bb; --dim:#5d7189;
  --primary:#0a84d0; --sky:#38bdf8; --cyan:#22d3ee; --green:#34d399; --yellow:#fbbf24; --purple:#a78bfa; --red:#f87171;
  --btn:#1a2536; --btn-hi:#233247;
  --water:#0f2b49; --water-hi:#17497a; --ship:#7b90a8; --hit:#ef4444; --sunk:#7f1d1d; --miss:#cfe0f0; --ok:#10b981;
  --input:#03070f; --modal:#0c1a2e; --err:#fca5a5; --water-hov:#1f5f9c; --scan:#2c4f78; --scan-hi:#3c6a9e; --blk:#5a4a1c;
  --avbg:#0b1a2e; --stepbg:#0b1626; --bg1:#081a31; --bg2:#050d1b; --bg3:#030810; --glow:rgba(22,62,110,.85); --xpbg:#060d18;
  --off:#334155; --offtx:#cbd5e1; --overlay:rgba(2,6,14,.78); --badge-tx:#67e8f9; --ring:rgba(255,255,255,.85);
  --dng-bg:#3a0d14; --dng-bd:#7f1d2a; --dng-tx:#fca5a5; --shadow:rgba(0,0,0,.4);
  --font:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --num:'Orbitron',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;touch-action:manipulation}
body{min-height:100vh;min-height:100dvh;color:var(--text);font-family:var(--font);background-color:var(--bg2);
  background-image:radial-gradient(1100px 650px at 28% -8%,var(--glow) 0%,transparent 62%),linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
  background-attachment:fixed;-webkit-text-size-adjust:100%}
#app{max-width:1000px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(48px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.view{display:none}.view.active{display:block}
.pane{display:none}.pane.active{display:block}
h1,h2,h3{margin:0}
.muted{color:var(--muted)}
.msg{min-height:1.4em;text-align:center;margin:10px 0;font-size:.92rem;color:var(--muted)}
.msg.err{color:var(--err)}.msg.ok{color:var(--green)}
input,select{width:100%;background:var(--input);border:1px solid var(--border2);border-radius:10px;color:var(--text);
  padding:12px 14px;font:16px var(--font);margin-top:8px}
input:focus,select:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(56,189,248,.18)}
.field-label{display:block;font-size:13px;color:var(--muted);margin-top:14px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 15px var(--font);color:var(--text);
  background:var(--btn);border:1px solid transparent;border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer;
  user-select:none;transition:background .15s,box-shadow .15s,transform .1s}
.btn:hover:not(:disabled){background:var(--btn-hi)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--primary);color:#fff}.btn.primary:hover:not(:disabled){background:#0b95ea}
.btn.grad{background:linear-gradient(90deg,#1d4ed8,#0284c7);color:#fff;box-shadow:0 6px 22px rgba(14,165,233,.28)}
.btn.grad:hover:not(:disabled){background:linear-gradient(90deg,#2563eb,#0ea5e9)}
.btn.danger{background:var(--dng-bg);border-color:var(--dng-bd);color:var(--dng-tx)}.btn.danger:hover:not(:disabled){filter:brightness(1.15)}
.btn.ok{background:#059669;color:#fff}.btn.ok:hover:not(:disabled){background:#07a877}
.btn.ghost{background:transparent;color:var(--muted)}.btn.ghost:hover:not(:disabled){background:rgba(255,255,255,.05)}
.btn.wide{display:flex;width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}

/* Barre du haut */
.topbar{display:flex;align-items:center;gap:16px;padding:14px 18px;background:var(--card);border:1px solid var(--border);
  border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.av-up{width:64px;height:64px;flex:0 0 64px;border:2px dashed var(--sky);border-radius:14px;display:flex;align-items:center;
  justify-content:center;color:var(--dim);font-size:18px;cursor:pointer;overflow:hidden;background:rgba(0,0,0,.2);position:relative}
.av-up{font-size:34px;line-height:1;padding:0;font-family:inherit}
.av-up i{font-size:18px}
.av-up.has{border-style:solid;border-color:var(--border2)}
.av-up.guest{cursor:default}
.who{flex:1 1 200px;min-width:0;max-width:330px}
.who-line{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;min-width:0}
.who-line .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--badge-tx);background:rgba(14,116,144,.3);
  border:1px solid rgba(34,211,238,.45);border-radius:6px;padding:2px 7px;white-space:nowrap}
.xpbar{height:9px;border-radius:6px;background:var(--xpbg);border:1px solid rgba(100,140,180,.35);margin:9px 0 5px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#0ea5e9,#67e8f9);border-radius:6px;transition:width .6s}
.xprow{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.xprow b{color:var(--sky)}
.tabsnav{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.tabsnav .btn.on{background:var(--primary);color:#fff;box-shadow:0 0 0 2px var(--ring)}

/* Jouer */
.modes-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;max-width:770px;margin:clamp(24px,13vh,150px) auto 0}
.mode-card{text-align:left;background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:24px;color:var(--text);
  cursor:pointer;font:inherit;transition:transform .15s,border-color .15s,box-shadow .15s}
.mode-card:hover{transform:translateY(-3px);border-color:rgba(56,189,248,.6);box-shadow:0 14px 34px rgba(0,0,0,.4)}
.mode-ic{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid;margin-bottom:26px}
.ic-cyan{color:#22d3ee;background:rgba(8,145,178,.18);border-color:rgba(34,211,238,.45)}
.ic-green{color:#6ee7b7;background:rgba(5,150,105,.2);border-color:rgba(52,211,153,.45)}
.ic-yellow{color:#fcd34d;background:rgba(180,120,10,.22);border-color:rgba(251,191,36,.45)}
.ic-purple{color:#c4b5fd;background:rgba(124,58,237,.22);border-color:rgba(167,139,250,.5)}
.mode-card h3{font-size:20px;font-weight:800;margin-bottom:8px}
.mode-card p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}

/* Panneaux */
.panel{max-width:770px;margin:24px auto 0;background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:28px 32px}
.panel h2{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:800;padding-bottom:16px;margin-bottom:24px;border-bottom:1px solid var(--border)}
.panel h2 i{color:var(--cyan);font-size:22px}
.panel h3.sub{font-size:15px;font-weight:700;color:var(--muted);margin:26px 0 12px;text-transform:uppercase;letter-spacing:.06em}
.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.tile{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:20px 8px;text-align:center}
.tile i{font-size:20px;display:block;margin-bottom:10px}
.tile b{display:block;font:700 clamp(15px,4.6vw,20px) var(--num);margin-bottom:8px;letter-spacing:.02em}
.tile span{font-size:13px;color:var(--muted)}
.c-sky{color:var(--sky)}.c-purple{color:var(--purple)}.c-green{color:var(--green)}.c-red{color:var(--red)}.c-yellow{color:var(--yellow)}.c-white{color:var(--text)}
.set-row,.set-block{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-top:16px}
.set-row{display:flex;align-items:center;gap:14px}
.set-row>i{color:var(--sky);font-size:20px;width:24px;text-align:center}
.set-row b,.set-block>b{display:block;font-size:16px;font-weight:700}
.set-row small,.set-block>small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.set-block>b i{color:var(--yellow);margin-right:6px}
.toggle{margin-left:auto;font:800 13px var(--font);min-width:54px;padding:9px 12px;border-radius:9px;border:0;cursor:pointer}
.toggle.on{background:#059669;color:#fff}.toggle.off{background:var(--off);color:var(--offtx)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>.btn{flex:1}

/* Connexion */
.auth{max-width:440px;margin:7vh auto 0;background:var(--card);border:1px solid var(--border2);border-radius:18px;padding:28px 26px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.brand{text-align:center}
.brand .logo{width:64px;height:64px;margin:0 auto 12px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-size:30px;color:var(--cyan);background:rgba(8,145,178,.18);border:1px solid rgba(34,211,238,.45)}
.brand h1{font-size:30px;font-weight:800;letter-spacing:.02em}
.brand p{color:var(--muted);margin:6px 0 0;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--input);border:1px solid var(--border);border-radius:12px;padding:4px;margin:22px 0 6px;gap:4px}
.seg button{background:transparent;border:0;color:var(--muted);font:600 14px var(--font);border-radius:9px;padding:10px;cursor:pointer}
.seg button.on{background:var(--primary);color:#fff}
.acc-pick{display:flex;flex-direction:column;gap:8px;max-height:230px;overflow:auto;margin-top:8px}
.acc{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:12px;background:var(--card2);border:1px solid var(--border);
  cursor:pointer;text-align:left;color:var(--text);font:inherit;width:100%}
.acc.on{border-color:var(--sky);box-shadow:0 0 0 1px var(--sky) inset}
.acc small{display:block;color:var(--muted);font-size:12px}
.mini-av{width:36px;height:36px;flex:0 0 auto;border-radius:10px;font-size:19px;line-height:1;background:var(--avbg);border:1px solid var(--border2);display:flex;
  align-items:center;justify-content:center;overflow:hidden;font-weight:800;color:var(--sky)}
.mini-av img{width:100%;height:100%;object-fit:cover}
.lang-mini{display:flex;justify-content:center;margin-top:10px}
.lang-mini select{width:auto;margin:0;padding:6px 10px;font-size:13px;background:transparent}

/* Salon */
.lobby-card{max-width:460px;margin:9vh auto 0;text-align:center;background:var(--card);border:1px solid var(--border2);border-radius:18px;padding:28px 24px}
.lobby-card h2{font-size:24px;font-weight:800;margin:8px 0 6px}
.code{font:700 2.4rem var(--num);letter-spacing:.22em;background:var(--input);border:1px solid var(--border2);border-radius:12px;
  padding:16px 0 16px .22em;margin:16px 0 12px;user-select:all;color:var(--cyan)}
.spin{width:46px;height:46px;border:4px solid rgba(56,189,248,.18);border-top-color:var(--sky);border-radius:50%;animation:spin 1s linear infinite;margin:18px auto 6px}
@keyframes spin{to{transform:rotate(360deg)}}
.count{font:700 15px var(--num);color:var(--yellow);margin-top:6px}

/* En-tête de partie */
.ghead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 14px;margin-bottom:14px}
.vs{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;flex:1;min-width:0;flex-wrap:wrap}
.vs .who2{display:flex;align-items:center;gap:8px;min-width:0}
.vs .mini-av{width:30px;height:30px;font-size:16px;border-radius:8px}
.vs .who2>span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34vw}
.vs .lv{font-size:11px;color:var(--sky);font-weight:700}
.vs .vsep{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}

/* Placement */
.place-wrap{display:grid;gap:16px}
.place-side h2{font-size:20px;font-weight:800;margin-bottom:6px}
.help{color:var(--muted);font-size:13.5px;line-height:1.45;margin:0 0 12px}
.ships{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.shipbtn{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:8px 10px;min-height:44px;font:600 12.5px var(--font);
  border:1px solid var(--border);border-radius:10px;background:var(--card2);color:var(--text);cursor:pointer;flex:1 1 120px}
.shipbtn.sel{border-color:var(--yellow);box-shadow:0 0 0 1px var(--yellow) inset}
.shipbtn.placed{opacity:.55}.shipbtn.placed.sel{opacity:1}
.blocks{display:flex;gap:2px}.blocks i{width:10px;height:10px;background:var(--ship);border-radius:2px}
.shipbtn.placed .blocks i{background:var(--ok)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.tools .btn{font-size:13px;padding:8px 4px}

/* Grilles */
.grid{display:grid;grid-template-columns:.7fr repeat(var(--n,10),1fr);gap:2px;width:min(460px,100%);margin:0 auto;user-select:none}
.grid.small{width:min(340px,100%)}
#placeGrid{touch-action:none}
.lbl{display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:clamp(9px,2.5vw,12px);font-weight:700}
.grid.small .lbl{font-size:10px}
.cell{aspect-ratio:1;border-radius:4px;background:var(--water);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:clamp(11px,3.4vw,18px);line-height:1;cursor:default;transition:background .15s}
.grid.small .cell{font-size:clamp(9px,2.5vw,13px)}
.cell.ship{background:var(--ship)}
#placeGrid .cell{cursor:pointer}
#placeGrid .cell.ship{cursor:grab}
.cell.pv-ok{background:var(--ok);box-shadow:inset 0 0 0 2px #a7f3d0}
.cell.pv-bad{background:var(--hit);opacity:.85}
.cell.shielded{box-shadow:inset 0 0 0 2px var(--yellow)}
.cell.miss{color:var(--miss)}
.cell.hit{background:var(--hit);color:#fff}
.cell.sunk{background:var(--sunk);color:#fecaca}
.cell.blocked{background:var(--blk);color:var(--yellow)}
.cell.scanOcc{background:var(--scan);color:var(--yellow)}
.cell.scanEmpty{color:var(--miss)}
.cell.last{outline:2px solid var(--yellow);outline-offset:-2px}
.cell.target{cursor:pointer}
.grid.live .cell.target{background:var(--water-hi)}
.grid.live .cell.target:hover{background:var(--water-hov)}
.grid.live .cell.target.scanOcc{background:var(--scan-hi)}
.grid.pick{outline:3px solid var(--yellow);outline-offset:4px;border-radius:6px}
.grid.pick .cell.ship{cursor:pointer}
.glabel{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;width:min(460px,100%);margin:0 auto 8px;font-size:13px;color:var(--muted);font-weight:600}
.small-label{width:min(340px,100%)}
.fleet{display:flex;gap:4px;flex-wrap:wrap}
.fleet span{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--btn);color:var(--text)}
.fleet span.down{text-decoration:line-through;opacity:.45}

/* Partie */
.game-wrap{display:grid;gap:16px}
.status{text-align:center;font-weight:800;font-size:1.1rem;padding:11px;border-radius:12px;margin-bottom:12px;background:var(--btn);color:var(--muted)}
.status.me{background:#059669;color:#fff}
.status.wait{background:#b45309;color:#fff}
.modes{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-top:14px}
.modes button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;font:600 12px var(--font);color:var(--text);
  background:var(--btn);border:1px solid transparent;border-radius:10px;cursor:pointer;position:relative;min-height:54px}
.modes button .ic{font-size:16px}
.modes button.on{border-color:var(--yellow);box-shadow:0 0 0 1px var(--yellow) inset}
.modes button:disabled{opacity:.35;cursor:default}
.modes button b{position:absolute;top:4px;right:7px;font:700 11px var(--num);color:var(--yellow)}
.hint{text-align:center;color:var(--muted);font-size:13px;min-height:1.2em;margin:10px 0 0}
.log{text-align:center;font-size:14px;font-weight:600;min-height:1.3em;margin:8px 0 0}
.log.opp{color:var(--muted)}

/* Fenêtres */
.overlay{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.overlay.show{display:flex}
.modal{background:var(--modal);border:1px solid var(--border2);border-radius:16px;padding:24px 20px;width:100%;max-width:380px;max-height:calc(100dvh - 32px);overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.modal.center{text-align:center}
.modal h2{font-size:22px;font-weight:800;margin-bottom:6px}
.modal .sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.big{font-size:3rem}
.xpgain{font:700 1.5rem var(--num);color:var(--yellow);margin:8px 0 4px}
.lvlup{color:var(--green);font-weight:700;margin:4px 0}
.endnote{color:var(--muted);font-size:12px;margin:2px 0 8px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;background:var(--card2);border:1px solid var(--border);border-radius:12px;color:var(--text);cursor:pointer;font:inherit}
.opt:hover{border-color:var(--sky)}
.opt strong{display:block;font-size:15px}
.opt span{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px;max-height:min(46vh,360px);overflow:auto;margin-bottom:12px;padding:2px}
.emoji-grid button{height:48px;font-size:26px;line-height:1;border-radius:10px;border:1px solid var(--border);background:var(--card2);cursor:pointer}
.emoji-grid button:hover{border-color:var(--sky)}
.emoji-grid button.on{border-color:var(--yellow);box-shadow:0 0 0 1px var(--yellow) inset}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:12px}
.theme-btn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 6px;border-radius:12px;border:2px solid var(--border);
  background:var(--card2);color:var(--text);font:600 13px var(--font);cursor:pointer;min-height:44px}
.theme-btn.on{border-color:var(--yellow)}
.theme-btn .sw{width:100%;height:30px;border-radius:8px;border:1px solid rgba(128,128,128,.4)}
#codeInput{font:700 1.4rem var(--num);letter-spacing:.3em;text-transform:uppercase;text-align:center}

@media (min-width:1200px){
  #app{max-width:1180px}
  .grid{width:min(540px,100%)}.glabel{width:min(540px,100%)}
  .grid.small{width:min(380px,100%)}.small-label{width:min(380px,100%)}
}
@media (min-width:700px) and (orientation:landscape) and (max-width:879px){
  .place-wrap{grid-template-columns:minmax(0,1fr) 280px;align-items:start}
  .game-wrap{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}
  .grid{width:min(460px,100%,max(300px,calc(100dvh - 130px)))}
  .grid.small{width:min(300px,100%)}
}
@media (min-width:880px){
  .place-wrap{grid-template-columns:minmax(0,1fr) 330px;align-items:start}
  .game-wrap{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}
}
@media (max-width:879px){
  .grid.small{width:min(270px,80%)}
  .small-label{width:min(270px,80%)}
}
.stepper{display:flex;align-items:center;gap:10px;margin-left:auto}
.stepper button{width:40px;height:40px;border-radius:9px;border:1px solid var(--border2);background:var(--stepbg);color:var(--text);font:800 18px var(--font);cursor:pointer}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper output{min-width:56px;text-align:center;font-weight:800}
.rule-ship{display:flex;align-items:center;gap:12px;margin-top:10px}
.rule-ship .blocks{display:flex;gap:2px}.rule-ship .blocks i{width:11px;height:11px;border-radius:2px;background:var(--ship)}
.rule-ship span.nm{min-width:86px;font-weight:600;font-size:14px}
.rule-ship .stepper{gap:6px}.rule-ship .stepper output{min-width:24px}
.rules-sum{text-align:center;margin-top:18px}
.rules-sum a{color:var(--sky);cursor:pointer;text-decoration:underline}
@media (max-width:760px){
  .topbar{flex-wrap:wrap;padding:12px}
  .tabsnav{width:100%;margin-left:0}
  .tabsnav .btn{flex:1;padding:8px 6px;font-size:13px}
  .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .panel{padding:20px 16px}
  .panel h2{font-size:21px}
}
@media (max-width:640px){
  #app{padding:12px 12px 40px}
  .modes-grid{grid-template-columns:1fr;gap:12px;margin-top:20px}
  .mode-card{padding:16px;display:grid;grid-template-columns:48px 1fr;column-gap:14px;align-items:center}
  .mode-ic{margin:0;grid-row:span 2}
  .mode-card h3{font-size:17px;margin:0 0 3px}
}
@media (max-width:520px){
  .av-up{width:54px;height:54px;flex-basis:54px;font-size:28px}
  .who-line{font-size:16px}
  .modes button{font-size:11px;padding:8px 0}
  .rule-ship{gap:8px}.rule-ship span.nm{min-width:70px;font-size:13px}
  .set-row{flex-wrap:wrap}
  .set-row .stepper{margin-left:auto}
  .glabel{font-size:12px}
  .ghead{padding:8px 10px}
  .lobby-card,.auth{margin-top:3vh;padding:22px 16px}
  .themes{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}
}
@media (max-width:360px){
  #app{padding-left:8px;padding-right:8px}
  .stat-grid{gap:8px}.tile{padding:14px 4px}
  .rule-ship .blocks{display:none}
  .tools .btn span{font-size:12px}
  .code{font-size:1.6rem}
}
@media (max-height:520px) and (orientation:landscape){
  .auth,.lobby-card{margin-top:2vh}
  .modes-grid{margin-top:12px}
  .modal{padding:16px}
}
@media (max-width:520px){
  .tabsnav .btn span{display:none}
  .tabsnav .btn{font-size:16px}
  .code{font-size:2rem}
}

<body>
<div id="app">

  <!-- ===== Connexion / création de compte ===== -->
  <section id="auth" class="view">
    <div class="auth">
      <div class="brand">
        <div class="logo"><i class="fa-solid fa-anchor"></i></div>
        <h1>C02 Naval</h1>
        <p data-i18n="tagline"></p>
      </div>
      <div class="seg">
        <button id="segLogin" class="on" data-i18n="tabLogin"></button>
        <button id="segSignup" data-i18n="tabSignup"></button>
      </div>
      <div id="loginPane">
        <span class="field-label" data-i18n="account"></span>
        <div id="accPick" class="acc-pick"></div>
        <label class="field-label" for="loginPass" data-i18n="password"></label>
        <input id="loginPass" type="password" autocomplete="current-password">
        <button id="btnLogin" class="btn primary wide" style="margin-top:16px"><i class="fa-solid fa-right-to-bracket"></i><span data-i18n="btnLogin"></span></button>
      </div>
      <div id="signupPane" style="display:none">
        <label class="field-label" for="suName" data-i18n="pseudo"></label>
        <input id="suName" maxlength="16" autocomplete="username">
        <label class="field-label" for="suPass" data-i18n="password"></label>
        <input id="suPass" type="password" autocomplete="new-password">
        <label class="field-label" for="suPass2" data-i18n="passwordConfirm"></label>
        <input id="suPass2" type="password" autocomplete="new-password">
        <button id="btnSignup" class="btn primary wide" style="margin-top:16px"><i class="fa-solid fa-user-plus"></i><span data-i18n="btnSignup"></span></button>
      </div>
      <p id="authMsg" class="msg"></p>
      <button id="btnGuest" class="btn ghost wide" data-i18n="guest"></button>
      <p class="msg" style="font-size:12px;margin:4px 0 0" data-i18n="localNote"></p>
      <div class="lang-mini"><select id="langMini" aria-label="Langue / Language"><option value="fr">Français</option><option value="en">English</option></select></div>
    </div>
  </section>

  <!-- ===== Tableau de bord ===== -->
  <section id="dash" class="view">
    <header class="topbar">
      <button id="avUp" class="av-up" type="button" title="">
        <span id="avImg"><i class="fa-solid fa-face-smile"></i></span>
      </button>
      <div class="who">
        <div class="who-line"><span id="tbName" class="nm"></span><span id="tbBadge" class="badge"></span></div>
        <div id="tbXpWrap">
          <div class="xpbar"><i id="tbXpFill" style="width:0"></i></div>
          <div class="xprow"><span>XP: <b id="tbXp"></b></span><span id="tbLevel"></span></div>
        </div>
      </div>
      <nav class="tabsnav">
        <button class="btn on" data-pane="play"><i class="fa-solid fa-crosshairs"></i><span data-i18n="navPlay"></span></button>
        <button class="btn" data-pane="stats"><i class="fa-solid fa-chart-pie"></i><span data-i18n="navStats"></span></button>
        <button class="btn" data-pane="rules"><i class="fa-solid fa-ruler-combined"></i><span data-i18n="navRules"></span></button>
        <button class="btn" data-pane="settings"><i class="fa-solid fa-gear"></i><span data-i18n="navSettings"></span></button>
        <button class="btn danger" id="btnLogout"><i class="fa-solid fa-power-off"></i><span data-i18n="navLogout"></span></button>
      </nav>
    </header>

    <div id="pane-play" class="pane active">
      <div class="modes-grid">
        <button class="mode-card" id="mRandom"><span class="mode-ic ic-cyan"><i class="fa-solid fa-shuffle"></i></span><h3 data-i18n="mRandomT"></h3><p data-i18n="mRandomD"></p></button>
        <button class="mode-card" id="mBot"><span class="mode-ic ic-green"><i class="fa-solid fa-robot"></i></span><h3 data-i18n="mBotT"></h3><p data-i18n="mBotD"></p></button>
        <button class="mode-card" id="mJoin"><span class="mode-ic ic-yellow"><i class="fa-solid fa-right-to-bracket"></i></span><h3 data-i18n="mJoinT"></h3><p data-i18n="mJoinD"></p></button>
        <button class="mode-card" id="mHost"><span class="mode-ic ic-purple"><i class="fa-solid fa-tower-broadcast"></i></span><h3 data-i18n="mHostT"></h3><p data-i18n="mHostD"></p></button>
      </div>
      <p id="rulesSum" class="msg rules-sum"></p>
      <p id="dashMsg" class="msg"></p>
    </div>

    <div id="pane-rules" class="pane">
      <div class="panel">
        <h2><i class="fa-solid fa-ruler-combined"></i><span data-i18n="rulesTitle"></span></h2>
        <p class="msg" data-i18n="rulesIntro"></p>
        <div id="rulesBox"></div>
      </div>
    </div>

    <div id="pane-stats" class="pane">
      <div class="panel">
        <h2><i class="fa-solid fa-chart-line"></i><span data-i18n="statsTitle"></span></h2>
        <div id="careerGrid" class="stat-grid"></div>
        <h3 class="sub" data-i18n="combatTitle"></h3>
        <div id="combatGrid" class="stat-grid"></div>
        <p id="statsGuest" class="msg" data-i18n="guestStats"></p>
      </div>
    </div>

    <div id="pane-settings" class="pane">
      <div class="panel">
        <h2><i class="fa-solid fa-sliders"></i><span data-i18n="setTitle"></span></h2>
        <div class="set-row">
          <i class="fa-solid fa-volume-high"></i>
          <div><b data-i18n="sndT"></b><small data-i18n="sndD"></small></div>
          <button id="sndToggle" class="toggle on">ON</button>
        </div>
        <div class="set-block">
          <b data-i18n="langT"></b><small data-i18n="langD"></small>
          <select id="langSel"><option value="fr">Français</option><option value="en">English</option></select>
        </div>
        <div class="set-block">
          <b><i class="fa-solid fa-palette"></i><span data-i18n="themeT"></span></b><small data-i18n="themeD"></small>
          <div id="themeBox" class="themes"></div>
        </div>
        <div class="set-block">
          <b><i class="fa-solid fa-network-wired"></i><span data-i18n="advT"></span></b><small data-i18n="advD"></small>
          <input id="turnUrl" autocomplete="off" spellcheck="false" data-ph="turnUrlPh">
          <input id="turnUser" autocomplete="off" spellcheck="false" data-ph="turnUserPh">
          <input id="turnCred" type="password" autocomplete="off" data-ph="turnCredPh">
          <p id="turnMsg" class="msg"></p>
        </div>
        <div id="acctSettings">
          <div class="set-block">
            <b><i class="fa-solid fa-face-smile"></i><span data-i18n="photoT"></span></b><small data-i18n="photoD"></small>
            <div class="row" style="margin-top:12px">
              <button id="btnPhoto" class="btn"><i class="fa-solid fa-face-smile"></i><span data-i18n="photoChange"></span></button>
              <button id="btnPhotoDel" class="btn"><i class="fa-solid fa-xmark"></i><span data-i18n="photoRemove"></span></button>
            </div>
          </div>
          <div class="set-block">
            <b><i class="fa-solid fa-user-shield"></i><span data-i18n="editT"></span></b>
            <label class="field-label" for="editName" data-i18n="newPseudo"></label>
            <input id="editName" maxlength="16" autocomplete="username">
            <label class="field-label" for="editPass" data-i18n="newPass"></label>
            <input id="editPass" type="password" autocomplete="new-password" placeholder="••••••••">
            <button id="btnSaveProfile" class="btn grad wide" style="margin-top:16px" data-i18n="save"></button>
            <p id="setMsg" class="msg"></p>
          </div>
          <div class="set-row">
            <i class="fa-solid fa-trash-can" style="color:var(--red)"></i>
            <div><b data-i18n="deleteT"></b><small data-i18n="deleteD"></small></div>
            <button id="btnDelete" class="btn danger sm" style="margin-left:auto" data-i18n="deleteBtn"></button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== Salon : privé ou recherche aléatoire ===== -->
  <section id="lobby" class="view">
    <div class="lobby-card">
      <div id="lobbyIcon" class="mode-ic ic-purple" style="margin:0 auto"><i class="fa-solid fa-tower-broadcast"></i></div>
      <h2 id="lobbyTitle"></h2>
      <p id="lobbyDesc" class="muted" style="margin:0"></p>
      <div id="hostBox">
        <div id="codeBox" class="code">······</div>
        <div class="row">
          <button id="btnCopy" class="btn"><i class="fa-regular fa-copy"></i><span data-i18n="copyCode"></span></button>
          <button id="btnCopyLink" class="btn"><i class="fa-solid fa-link"></i><span data-i18n="copyLink"></span></button>
        </div>
      </div>
      <div class="spin"></div>
      <p id="lobbyMsg" class="msg"></p>
      <div id="lobbyCount" class="count"></div>
      <button class="btn ghost wide" style="margin-top:10px" onclick="location.reload()" data-i18n="cancel"></button>
    </div>
  </section>

  <!-- ===== Placement ===== -->
  <section id="place" class="view">
    <div class="ghead">
      <div id="placeVs" class="vs"></div>
      <button class="btn ghost sm btnQuit"><i class="fa-solid fa-door-open"></i><span data-i18n="quit"></span></button>
    </div>
    <div class="place-wrap">
      <div class="card">
        <div id="placeGrid" class="grid"></div>
      </div>
      <div class="card place-side">
        <h2 data-i18n="placeTitle"></h2>
        <p class="help" data-i18n="placeHelp"></p>
        <p id="rulesInfo" class="help" style="color:var(--sky)"></p>
        <div id="shipList" class="ships"></div>
        <div class="tools">
          <button id="btnRotate" class="btn"><i class="fa-solid fa-rotate"></i><span id="rotLbl"></span></button>
          <button id="btnRandom" class="btn"><i class="fa-solid fa-dice"></i><span data-i18n="random"></span></button>
          <button id="btnClear" class="btn"><i class="fa-solid fa-broom"></i><span data-i18n="clear"></span></button>
        </div>
        <div class="row">
          <button id="btnConfirm" class="btn ok"><i class="fa-solid fa-check"></i><span data-i18n="confirm"></span></button>
          <button id="btnRemove" class="btn"><i class="fa-solid fa-xmark"></i><span data-i18n="remove"></span></button>
        </div>
        <p id="placeMsg" class="msg"></p>
        <button id="btnReady" class="btn primary wide" disabled><i class="fa-solid fa-flag-checkered"></i><span data-i18n="ready"></span></button>
      </div>
    </div>
  </section>

  <!-- ===== Partie ===== -->
  <section id="game" class="view">
    <div class="ghead">
      <div id="gameVs" class="vs"></div>
      <button class="btn ghost sm btnQuit"><i class="fa-solid fa-door-open"></i><span data-i18n="quit"></span></button>
    </div>
    <div id="status" class="status"></div>
    <div class="game-wrap">
      <div class="card">
        <div class="glabel"><span id="enemyLabel"></span><span id="enemyFleet" class="fleet"></span></div>
        <div id="enemyGrid" class="grid"></div>
      </div>
      <div class="card">
        <div class="glabel small-label"><span data-i18n="myFleet"></span></div>
        <div id="myGrid" class="grid small"></div>
        <div id="modes" class="modes">
          <button data-mode="shot"><i class="ic fa-solid fa-crosshairs"></i><span data-i18n="modeShot"></span></button>
          <button data-mode="radar"><i class="ic fa-solid fa-satellite-dish"></i><span data-i18n="modeRadar"></span><b></b></button>
          <button data-mode="cross"><i class="ic fa-solid fa-plus"></i><span data-i18n="modeCross"></span><b></b></button>
          <button data-mode="shield"><i class="ic fa-solid fa-shield-halved"></i><span data-i18n="modeShield"></span><b></b></button>
        </div>
        <p id="hint" class="hint"></p>
        <p id="log" class="log"></p>
      </div>
    </div>
  </section>
</div>

<!-- Rejoindre -->
<div id="joinModal" class="overlay">
  <div class="modal">
    <div class="mode-ic ic-yellow" style="margin:0 0 14px"><i class="fa-solid fa-right-to-bracket"></i></div>
    <h2 data-i18n="mJoinT"></h2>
    <p class="sub" data-i18n="mJoinD"></p>
    <input id="codeInput" maxlength="6" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="CODE">
    <p id="joinMsg" class="msg"></p>
    <button id="btnJoin" class="btn primary wide" data-i18n="btnJoin"></button>
    <button id="btnJoinCancel" class="btn ghost wide" data-i18n="cancel"></button>
  </div>
</div>

<!-- Choix de l'avatar (emoji) -->
<div id="emojiModal" class="overlay">
  <div class="modal">
    <h2 data-i18n="emojiPick"></h2>
    <p class="sub" data-i18n="emojiNote"></p>
    <div id="emojiGrid" class="emoji-grid"></div>
    <button id="btnEmojiCancel" class="btn ghost wide" data-i18n="cancel"></button>
  </div>
</div>

<!-- Choix d'amélioration -->
<div id="choice" class="overlay">
  <div class="modal">
    <h2 data-i18n="choiceTitle"></h2>
    <p id="choiceSub" class="sub"></p>
    <div id="choiceList"></div>
  </div>
</div>

<!-- Fin de partie -->
<div id="end" class="overlay">
  <div class="modal center">
    <div id="endIcon" class="big"></div>
    <h2 id="endTitle"></h2>
    <p id="endText" class="sub"></p>
    <div id="endXp"></div>
    <button class="btn primary wide" style="margin-top:12px" onclick="location.reload()" data-i18n="newGame"></button>
    <button id="btnSeeGrids" class="btn ghost wide" data-i18n="seeGrids"></button>
  </div>
</div>

const SETTINGS_KEY = 'c02naval.v1.settings';
const settings = { sound: true, lang: (navigator.language || 'fr').toLowerCase().startsWith('fr') ? 'fr' : 'en' };
try { Object.assign(settings, JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}); } catch (e) {}
if (!I18N[settings.lang]) settings.lang = 'fr';
if (typeof settings.theme !== 'string') settings.theme = 'ocean';
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {} }
function t(key, p = {}) {
  let v = I18N[settings.lang][key];
  if (v === undefined) v = I18N.fr[key];
  if (v === undefined) return key;
  if (typeof v === 'function') return v(p);
  if (typeof v !== 'string') return v;
  return v.replace(/\{(\w+)\}/g, (_, k) => (p[k] !== undefined ? p[k] : ''));
}
function applyLang() {
  document.documentElement.lang = settings.lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $('langSel').value = $('langMini').value = settings.lang;
  document.querySelectorAll('[data-ph]').forEach(el => { el.placeholder = t(el.dataset.ph); });
}

const MM_PREFIX = 'c02-naval-mm-v1-', MM_SLOTS = 6, MM_WAIT_MS = 45000;
let LENS = [5, 4, 3, 3, 2];
function shipName(i) {
  const len = LENS[i], list = (t('shipNames') || {})[len] || ['#' + len];
  const same = LENS.filter(l => l === len).length;
  const occ = LENS.slice(0, i).filter(l => l === len).length;
  if (same === 1) return list[0];
  return list[occ] || `${list[0]} ${occ + 1}`;
}

function occOf(ships) {

function randomCells(lens) {
  for (let attempt = 0; attempt < 50; attempt++) {
    const out = randomCellsOnce(lens);
    if (out.every(Boolean)) return out;
  }
  return randomCellsOnce(lens);
}
function randomCellsOnce(lens) {
  const ships = lens.map(len => ({ len, cells: null }));
  for (const s of ships) {
    for (let tries = 0; tries < 3000 && !s.cells; tries++) {
      const occ = occOf(ships), h = Math.random() < 0.5;
      const r = Math.floor(Math.random() * N), c = Math.floor(Math.random() * N), cells = [];
      for (let i = 0; i < s.len; i++) {
        const rr = r + (h ? 0 : i), cc = c + (h ? i : 0);
        if (!inside(rr, cc) || occ[rr * N + cc] !== -1) break;

  return Math.floor(sec / 3600) + 'h ' + String(Math.floor(sec % 3600 / 60)).padStart(2, '0') + 'm';
}

/* =========================================================
   Règles personnalisables (taille de grille, flotte, améliorations)
   ========================================================= */
const MIN_SIZE = 6, MAX_SIZE = 15, MAX_LEN = 6, MAX_SHIPS = 10;
const DEFAULT_RULES = { size: 10, fleet: [5, 4, 3, 3, 2], radar: true, cross: true, shield: true, timer: 0 };
const maxCells = size => Math.floor(size * size * 0.4);
const sumOf = a => a.reduce((x, y) => x + y, 0);
// Valide et normalise des règles (venant du stockage ou du réseau). Renvoie null si invalides.
function sanitizeRules(c) {
  if (!c || typeof c !== 'object') return null;
  const size = c.size;
  if (!Number.isInteger(size) || size < MIN_SIZE || size > MAX_SIZE) return null;
  if (!Array.isArray(c.fleet) || c.fleet.length < 1 || c.fleet.length > MAX_SHIPS) return null;
  if (!c.fleet.every(l => Number.isInteger(l) && l >= 1 && l <= MAX_LEN)) return null;
  const fleet = c.fleet.slice().sort((a, b) => b - a);
  if (sumOf(fleet) > maxCells(size)) return null;
  return { size, fleet, radar: c.radar !== false, cross: c.cross !== false, shield: c.shield !== false, timer: TIMER_CHOICES.includes(c.timer) ? c.timer : 0 };
}
const cloneRules = r => ({ ...r, fleet: r.fleet.slice() });
const sameRules = (a, b) => a.size === b.size && a.fleet.join() === b.fleet.join() && a.radar === b.radar && a.cross === b.cross && a.shield === b.shield && a.timer === b.timer;
const isStdRules = r => sameRules(r, DEFAULT_RULES);
let RULES = sanitizeRules(settings.rules) || cloneRules(DEFAULT_RULES);   // règles choisies par le joueur (hôte / bot)
let CFG = cloneRules(RULES);                                              // règles de la partie en cours
if (typeof settings.bot !== 'boolean') settings.bot = true;
if (![0, 1, 2].includes(settings.skill)) settings.skill = 2;
const upgradeOn = k => !!CFG[k];
const anyUpgrade = () => CFG.radar || CFG.cross || CFG.shield;

function applyConfig(rules) {
  CFG = cloneRules(rules);
  N = CFG.size; LENS = CFG.fleet.slice();
  S.ships = LENS.map((len, i) => ({ i, len, cells: null, shield: 'none' }));
  S.enemy = Array(N * N).fill(null); S.incoming = Array(N * N).fill(null);
  S.enemySunk = []; S.lastIn = []; S.sel = 0; S.preview = null; S.lifted = null; S.drag = null;
  buildGrids();
}

function buildGrid(el, onTap) {
  // Repères : chiffres 1–10 en haut, lettres A–J à gauche (comme dans les messages « C5 »).
  el.innerHTML = ''; el.style.setProperty('--n', N);
  const lbl = txt => { const s = document.createElement('div'); s.className = 'lbl'; s.textContent = txt; el.appendChild(s); };
  el.cells = [];

  for (let c = 0; c < N; c++) lbl(c + 1);

/* =========================================================
   Effets sonores (synthétisés, aucun fichier à charger)
   ========================================================= */
const Snd = {
  ctx: null,
  get() {
    if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; this.ctx = new AC(); }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(c, f, dur, type = 'sine', vol = 0.15, when = 0, to = null) {
    const o = c.createOscillator(), g = c.createGain(), t0 = c.currentTime + when;
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noise(c, dur, freq, vol = 0.3, when = 0, type = 'lowpass') {
    const len = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t0 = c.currentTime + when;
    s.buffer = b; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f).connect(g).connect(c.destination); s.start(t0);
  },
  play(name) {
    if (!settings.sound) return;
    try {
      const c = this.get(); if (!c) return;
      switch (name) {
        case 'click': this.tone(c, 640, 0.05, 'square', 0.04); break;
        case 'place': this.tone(c, 520, 0.08, 'triangle', 0.1); this.tone(c, 780, 0.08, 'triangle', 0.08, 0.05); break;
        case 'shot': this.noise(c, 0.18, 2600, 0.18, 0, 'highpass'); this.tone(c, 220, 0.15, 'sine', 0.15, 0, 70); break;
        case 'miss': this.noise(c, 0.7, 900, 0.22); this.tone(c, 300, 0.25, 'sine', 0.05, 0.02, 120); break;
        case 'hit': this.noise(c, 0.55, 420, 0.5); this.tone(c, 95, 0.45, 'sine', 0.4, 0, 40); break;
        case 'sunk': this.noise(c, 0.5, 450, 0.5); this.tone(c, 90, 0.5, 'sine', 0.4, 0, 35); this.noise(c, 1.1, 220, 0.45, 0.25); this.tone(c, 60, 0.9, 'sawtooth', 0.08, 0.2, 28); break;
        case 'blocked': this.tone(c, 880, 0.3, 'triangle', 0.14); this.tone(c, 1320, 0.35, 'triangle', 0.08, 0.04); break;
        case 'radar': this.tone(c, 900, 0.22, 'sine', 0.1, 0, 1700); this.tone(c, 900, 0.22, 'sine', 0.08, 0.28, 1700); break;
        case 'shield': this.tone(c, 660, 0.2, 'triangle', 0.12); this.tone(c, 990, 0.3, 'triangle', 0.1, 0.1); break;
        case 'turn': this.tone(c, 740, 0.09, 'sine', 0.1); this.tone(c, 988, 0.13, 'sine', 0.1, 0.1); break;
        case 'upgrade': [523, 659, 784].forEach((f, i) => this.tone(c, f, 0.14, 'triangle', 0.1, i * 0.08)); break;
        case 'win': [523, 659, 784, 1047].forEach((f, i) => this.tone(c, f, 0.3, 'triangle', 0.14, i * 0.13)); break;
        case 'lose': [392, 330, 262, 196].forEach((f, i) => this.tone(c, f, 0.35, 'triangle', 0.12, i * 0.16)); break;
        case 'start': this.tone(c, 440, 0.12, 'square', 0.05); this.tone(c, 660, 0.18, 'square', 0.05, 0.12); break;
      }
    } catch (e) {}
  },
  buzz(pattern) { if (settings.sound && navigator.vibrate) try { navigator.vibrate(pattern); } catch (e) {} },
};

/* =========================================================
   Comptes locaux : pseudo, mot de passe, photo, XP, statistiques
   Chaque compte est rangé sous sa propre clé : deux onglets qui jouent l'un contre
   l'autre dans le même navigateur ne peuvent pas écraser l'XP de l'autre.

const STORE_KEY = 'c02naval.v1';
const ACC_PREFIX = STORE_KEY + '.acc.', CUR_KEY = STORE_KEY + '.current', TAB_KEY = STORE_KEY + '.tab';
const xpFor = l => 50 * l * (l - 1);               // XP total pour atteindre le niveau l : 0, 100, 300, 600, 1000…
function levelOf(xp) { let l = 1; while (xp >= xpFor(l + 1)) l++; return l; }
const rankOf = l => { const r = t('ranks'); return r[Math.min(l - 1, r.length - 1)]; };
const emptyStats = () => ({ games: 0, wins: 0, losses: 0, interrupted: 0, streak: 0, bestStreak: 0,
  shots: 0, hits: 0, sunk: 0, upgrades: 0, fastestWin: null, timePlayed: 0 });

let accounts = {};
let storageOk = true;
let curId = null;            // compte connecté dans CET onglet (null = invité)
let loggedIn = false;
function loadAccounts() {
  try {
    const out = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !k.startsWith(ACC_PREFIX)) continue;
      try { const a = JSON.parse(localStorage.getItem(k)); if (a && a.id && a.name) out[a.id] = a; } catch (e) {}
    }
    accounts = out; storageOk = true;
  } catch (e) { storageOk = false; }   // stockage bloqué : on garde ce qui est en mémoire
}
function saveAccount(a) {
  accounts[a.id] = a;
  try { localStorage.setItem(ACC_PREFIX + a.id, JSON.stringify(a)); storageOk = true; } catch (e) { storageOk = false; }
}
const me = () => (curId ? accounts[curId] || null : null);
function setSession(id) {
  curId = id; loggedIn = true;
  try {
    if (id) { sessionStorage.setItem(TAB_KEY, id); localStorage.setItem(CUR_KEY, id); }
    else sessionStorage.setItem(TAB_KEY, 'guest');
  } catch (e) {}
}
function clearSession() {
  curId = null; loggedIn = false;
  try { sessionStorage.removeItem(TAB_KEY); localStorage.removeItem(CUR_KEY); } catch (e) {}
}
function restoreSession() {
  let id = null;
  try { id = sessionStorage.getItem(TAB_KEY) || localStorage.getItem(CUR_KEY); } catch (e) {}
  if (id === 'guest') { curId = null; loggedIn = true; return; }
  if (id && accounts[id]) { curId = id; loggedIn = true; }
}

// Mot de passe : PBKDF2-SHA-256 salé (jamais stocké en clair).
const b64e = u8 => btoa(String.fromCharCode(...u8));
const b64d = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
async function hashPass(pw, saltB64, iter = 120000) {
  if (!window.crypto || !crypto.subtle) throw new Error('nocrypto');
  const salt = saltB64 ? b64d(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, key, 256);
  return { salt: b64e(salt), hash: b64e(new Uint8Array(bits)), iter };
}
const nameTaken = (name, exceptId) => Object.values(accounts).some(a => a.id !== exceptId && a.name.toLowerCase() === name.toLowerCase());

/* ---------- Écran de connexion ---------- */
let authTab = 'login', pickedId = null;
function openAuth(tab) {
  loadAccounts();
  authTab = tab || (Object.keys(accounts).length ? 'login' : 'signup');
  const accs = Object.values(accounts).sort((a, b) => (b.lastLogin || '').localeCompare(a.lastLogin || ''));
  if (!pickedId || !accounts[pickedId]) pickedId = accs.length ? accs[0].id : null;
  $('segLogin').classList.toggle('on', authTab === 'login');
  $('segSignup').classList.toggle('on', authTab === 'signup');
  $('loginPane').style.display = authTab === 'login' ? '' : 'none';
  $('signupPane').style.display = authTab === 'signup' ? '' : 'none';
  const list = $('accPick'); list.innerHTML = '';
  if (!accs.length) list.innerHTML = `<p class="msg" style="margin:6px 0">${esc(t('noAccounts'))}</p>`;
  accs.forEach(a => {
    const b = document.createElement('button');
    b.className = 'acc' + (a.id === pickedId ? ' on' : '');
    b.innerHTML = `${avatarHTML(a.emoji, a.name)}<span><strong>${esc(a.name)}</strong><small>${esc(t('levelN', { n: levelOf(a.xp) }))} · ${a.xp} XP</small></span>`;
    b.onclick = () => { pickedId = a.id; openAuth('login'); $('loginPass').focus(); };
    list.appendChild(b);
  });
  $('btnLogin').disabled = !accs.length;
  showView('auth');
}
async function doLogin() {
  loadAccounts();
  const a = accounts[pickedId];
  if (!a) return msg('authMsg', t('errPickAcc'), true);
  if (a.pass) {
    try {
      const h = await hashPass($('loginPass').value, a.pass.salt, a.pass.iter);
      if (h.hash !== a.pass.hash) { Snd.play('blocked'); return msg('authMsg', t('errPassWrong'), true); }
    } catch (e) { return msg('authMsg', t('errNoCrypto'), true); }
  }
  a.lastLogin = new Date().toISOString(); saveAccount(a);
  $('loginPass').value = '';
  setSession(a.id);
  openDash('play');
  msg('dashMsg', a.pass ? t('welcome', { name: a.name }) : t('noPassHint'), a.pass ? 'ok' : true);
}
async function doSignup() {
  loadAccounts();
  const name = $('suName').value.trim().replace(/\s+/g, ' ');
  const pw = $('suPass').value, pw2 = $('suPass2').value;
  if (name.length < 2 || name.length > 16) return msg('authMsg', t('errPseudoLen'), true);
  if (nameTaken(name)) return msg('authMsg', t('errPseudoTaken'), true);
  if (pw.length < 4) return msg('authMsg', t('errPassLen'), true);
  if (pw !== pw2) return msg('authMsg', t('errPassMatch'), true);
  let pass;
  try { pass = await hashPass(pw); } catch (e) { return msg('authMsg', t('errNoCrypto'), true); }
  const id = 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const now = new Date().toISOString();
  const acc = { id, name, pass, emoji: EMOJIS[Math.floor(Math.random() * EMOJIS.length)], xp: 0, created: now, lastLogin: now, stats: emptyStats() };
  saveAccount(acc);
  $('suName').value = $('suPass').value = $('suPass2').value = '';
  setSession(id);
  openDash('play');
  msg('dashMsg', storageOk ? t('welcome', { name }) : t('errStorage'), storageOk ? 'ok' : true);
}

/* ---------- Écran « Règles » ---------- */
function setRules(fn) {
  const c = cloneRules(RULES); fn(c);
  const ok = sanitizeRules(c); if (!ok) return;
  RULES = ok; settings.rules = cloneRules(ok); saveSettings(); renderDash();
}
function renderRules() {
  const R = RULES, tot = sumOf(R.fleet), cap = maxCells(R.size);
  const cnt = len => R.fleet.filter(l => l === len).length;
  const step = (id, val, minus, plus) => `<div class="stepper"><button data-r="${id}-" ${minus ? '' : 'disabled'}>−</button><output>${val}</output><button data-r="${id}+" ${plus ? '' : 'disabled'}>+</button></div>`;

  h += `<div class="set-block"><b><i class="fa-solid fa-ship"></i>${esc(t('rFleetT'))}</b><small>${esc(t('rFleetD'))}</small>`;

  }
  h += `<small style="margin-top:12px;color:var(--sky)">${esc(t('rFleetTot', { n: R.fleet.length, cells: tot, pct: Math.round(tot / (R.size * R.size) * 100) }))}</small></div>`;
  h += `<div class="set-block"><b><i class="fa-solid fa-wand-magic-sparkles"></i>${esc(t('rUpT'))}</b><small>${esc(t('rUpD'))}</small>`;
  for (const k of ['radar', 'cross', 'shield']) {
    h += `<div class="set-row" style="margin-top:10px"><i class="fa-solid ${UPG[k][0]}"></i><div><b>${esc(t(UPG[k][1]))}</b><small>${esc(t(UPG[k][2]))}</small></div>${tog(k, R[k])}</div>`;
  }
  h += '</div>';

    + step('timer', R.timer ? t('timerN', { n: R.timer }) : t('timerOff'), TIMER_CHOICES.indexOf(R.timer) > 0, TIMER_CHOICES.indexOf(R.timer) < TIMER_CHOICES.length - 1) + '</div>';
  h += `<div class="set-row"><i class="fa-solid fa-robot"></i><div><b>${esc(t('rBotT'))}</b><small>${esc(t('rBotD'))}</small></div>${tog('bot', settings.bot)}</div>`;
  h += `<div class="set-block"><b>${esc(t('rSkillT'))}</b><select id="skillSel" ${settings.bot ? '' : 'disabled'}>`
    + [0, 1, 2].map(i => `<option value="${i}" ${settings.skill === i ? 'selected' : ''}>${esc(t('skill' + i))}</option>`).join('') + '</select></div>';
  h += `<div class="row" style="margin-top:18px"><button class="btn" data-r="reset"><i class="fa-solid fa-rotate-left"></i><span>${esc(t('rReset'))}</span></button></div>`;
  $('rulesBox').innerHTML = h;
  const sel = $('skillSel'); if (sel) sel.onchange = e => { settings.skill = +e.target.value; saveSettings(); };
}
$('rulesBox').addEventListener('click', e => {
  const b = e.target.closest('button[data-r]'); if (!b || b.disabled) return;
  const a = b.dataset.r; Snd.play('click');
  if (a === 'reset') return setRules(c => Object.assign(c, cloneRules(DEFAULT_RULES)));
  if (a === 't-bot') { settings.bot = !settings.bot; saveSettings(); return renderDash(); }
  if (a.startsWith('t-')) return setRules(c => { c[a.slice(2)] = !c[a.slice(2)]; });
  if (a.startsWith('timer')) return setRules(c => { const i = TIMER_CHOICES.indexOf(c.timer) + (a.endsWith('+') ? 1 : -1); c.timer = TIMER_CHOICES[Math.max(0, Math.min(TIMER_CHOICES.length - 1, i))]; });
  if (a.startsWith('size')) return setRules(c => {
    c.size += a.endsWith('+') ? 1 : -1;
    c.fleet.sort((x, y) => y - x);
    while (c.fleet.length > 1 && sumOf(c.fleet) > maxCells(c.size)) c.fleet.shift();   // flotte trop grande : on retire les plus gros bateaux
  });
  const m = /^f(\d)([+-])$/.exec(a);
  if (m) setRules(c => {
    const len = +m[1];
    if (m[2] === '+') c.fleet.push(len); else { const i = c.fleet.indexOf(len); if (i >= 0) c.fleet.splice(i, 1); }
  });
});

/* ---------- Enregistrement des parties ---------- */
function recordGame(win) {
  loadAccounts();
  const a = me(); if (!a) return null;
  const m = S.match, s = a.stats = { ...emptyStats(), ...a.stats };
  const acc = m.shots ? m.hits / m.shots : 0;
  let gain = (win ? 100 : 30) + m.hits * 5 + m.sunk * 20 + (win ? Math.round(acc * 50) : 0);
  if (S.vsBot || !isStdRules(CFG)) gain = Math.round(gain / 2);
  const before = levelOf(a.xp);
  a.xp += gain;
  s.games++; s.shots += m.shots; s.hits += m.hits; s.sunk += m.sunk; s.upgrades += m.upgrades;
  s.timePlayed += m.start ? Math.round((Date.now() - m.start) / 1000) : 0;
  if (win) {
    s.wins++; s.streak++; s.bestStreak = Math.max(s.bestStreak, s.streak);
    if (m.shots > 0 && (!s.fastestWin || m.shots < s.fastestWin)) s.fastestWin = m.shots;
  } else { s.losses++; s.streak = 0; }
  saveAccount(a);
  return { gain, level: levelOf(a.xp), up: levelOf(a.xp) > before };
}
function recordInterrupted() {
  if (S.phase !== 'game') return;
  loadAccounts();
  const a = me(); if (!a) return;
  a.stats = { ...emptyStats(), ...a.stats };
  a.stats.interrupted++;
  a.stats.timePlayed += S.match.start ? Math.round((Date.now() - S.match.start) / 1000) : 0;
  saveAccount(a);
}
function myIdentity() {
  const a = me();
  return a ? { name: a.name, emoji: validEmoji(a.emoji) ? a.emoji : null, level: levelOf(a.xp) } : { name: t('guestName'), emoji: null, level: 0 };
}
