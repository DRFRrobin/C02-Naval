<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050d1b">
<!-- Installable comme une application (écran d'accueil iPhone / Android) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="C02 Naval">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="C02 Naval : bataille navale à deux joueurs dans le navigateur, sur PC et téléphone.">
<title>C02 Naval</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script>
/* iPhone ajouté à l'écran d'accueil : la page passe sous l'heure / la Dynamic Island. env(safe-area-inset-top) vaut parfois 0
   (iOS 26) : la classe permet d'appliquer un espacement de secours (voir « ios-standalone » dans le CSS). */
try { if (/iPhone|iPod/.test(navigator.userAgent) && (navigator.standalone === true || matchMedia('(display-mode: standalone)').matches)) document.documentElement.classList.add('ios-standalone'); } catch (e) {}
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ===== Connexion / création de compte ===== -->
  <section id="auth" class="view">
    <div class="auth">
      <div class="brand">
        <div class="logo"><i class="fa-solid fa-anchor"></i></div>
        <h1>C02 Naval</h1>
        <p data-i18n="tagline"></p>
      </div>
      <div id="cloudPane" style="margin-top:22px;display:none">
        <div class="seg" role="tablist">
          <button id="tabLogin" class="btn on" type="button" data-i18n="tabLogin"></button>
          <button id="tabReg" class="btn" type="button" data-i18n="tabReg"></button>
        </div>
        <label class="field-label" for="cName" data-i18n="pseudo"></label>
        <input id="cName" maxlength="16" autocomplete="username" autocapitalize="off" spellcheck="false">
        <label class="field-label" for="cPass" data-i18n="password"></label>
        <input id="cPass" type="password" maxlength="128" autocomplete="current-password">
        <button id="btnCloud" class="btn primary wide" style="margin-top:16px" type="button"><i class="fa-solid fa-right-to-bracket"></i><span id="btnCloudT"></span></button>
        <p class="msg" style="font-size:12px;margin:10px 0 0" data-i18n="cloudNote"></p>
        <button id="btnLocalMode" class="linkbtn" type="button" data-i18n="goLocal"></button>
      </div>
      <div id="loginPane" style="margin-top:22px">
        <label class="field-label" for="suName" data-i18n="pseudo"></label>
        <input id="suName" maxlength="16" autocomplete="off" autocapitalize="words" spellcheck="false">
        <button id="btnPlay" class="btn primary wide" style="margin-top:16px"><i class="fa-solid fa-play"></i><span data-i18n="btnPlay"></span></button>
        <div id="accBox" style="display:none">
          <span class="field-label" data-i18n="recentPseudos"></span>
          <div id="accPick" class="acc-pick"></div>
        </div>
      </div>
      <p id="authMsg" class="msg"></p>
      <p id="localNote" class="msg" style="font-size:12px;margin:4px 0 0" data-i18n="localNote"></p>
      <button id="btnCloudMode" class="linkbtn" type="button" style="display:none" data-i18n="goCloud"></button>
      <div class="lang-mini"><select id="langMini" aria-label="Langue / Language"></select></div>
    </div>
  </section>

  <!-- ===== Tableau de bord ===== -->
  <section id="dash" class="view">
    <header class="topbar">
      <button id="avUp" class="av-up" type="button" title="">
        <span id="avImg"><i class="fa-solid fa-face-smile"></i></span>
      </button>
      <div class="who">
        <div class="who-line"><span id="tbName" class="nm"></span><span id="tbBadge" class="badge"></span></div>
        <div id="tbXpWrap">
          <div class="xpbar"><i id="tbXpFill" style="width:0"></i></div>
          <div class="xprow"><span>XP: <b id="tbXp"></b></span><span id="tbLevel"></span></div>
        </div>
      </div>
      <nav class="tabsnav">
        <button class="btn on" data-pane="play"><i class="fa-solid fa-crosshairs"></i><span data-i18n="navPlay"></span></button>
        <button class="btn" data-pane="stats"><i class="fa-solid fa-chart-pie"></i><span data-i18n="navStats"></span></button>
        <button class="btn" data-pane="rules"><i class="fa-solid fa-ruler-combined"></i><span data-i18n="navRules"></span></button>
        <button class="btn" data-pane="settings"><i class="fa-solid fa-gear"></i><span data-i18n="navSettings"></span></button>
        <button class="btn danger" id="btnLogout"><i class="fa-solid fa-power-off"></i><span data-i18n="navLogout"></span></button>
      </nav>
    </header>

    <div id="pane-play" class="pane active">
      <div id="installTip" class="install-tip" role="note">
        <i class="fa-solid fa-mobile-screen-button"></i>
        <div><b data-i18n="instTipT"></b><small id="instTipD"></small></div>
        <button id="btnInstTip" class="btn primary"></button>
        <button id="btnInstTipX" class="x" aria-label="×">×</button>
      </div>
      <div class="modes-grid">
        <button class="mode-card" id="mRandom"><span class="mode-ic ic-cyan"><i class="fa-solid fa-shuffle"></i></span><h3 data-i18n="mRandomT"></h3><p data-i18n="mRandomD"></p></button>
        <button class="mode-card" id="mBot"><span class="mode-ic ic-green"><i class="fa-solid fa-robot"></i></span><h3 data-i18n="mBotT"></h3><p data-i18n="mBotD"></p></button>
        <button class="mode-card" id="mJoin"><span class="mode-ic ic-yellow"><i class="fa-solid fa-right-to-bracket"></i></span><h3 data-i18n="mJoinT"></h3><p data-i18n="mJoinD"></p></button>
        <button class="mode-card" id="mHost"><span class="mode-ic ic-purple"><i class="fa-solid fa-tower-broadcast"></i></span><h3 data-i18n="mHostT"></h3><p data-i18n="mHostD"></p></button>
      </div>
      <p id="rulesSum" class="msg rules-sum"></p>
      <p id="dashMsg" class="msg"></p>
    </div>

    <div id="pane-rules" class="pane">
      <div class="panel">
        <h2><i class="fa-solid fa-ruler-combined"></i><span data-i18n="rulesTitle"></span></h2>
        <p class="msg" data-i18n="rulesIntro"></p>
        <div id="rulesBox"></div>
      </div>
    </div>

    <div id="pane-stats" class="pane">
      <div class="panel">
        <h2><i class="fa-solid fa-chart-line"></i><span data-i18n="statsTitle"></span></h2>
        <div id="careerGrid" class="stat-grid"></div>
        <h3 class="sub" data-i18n="combatTitle"></h3>
        <div id="combatGrid" class="stat-grid"></div>
        <p id="statsGuest" class="msg" data-i18n="guestStats"></p>
      </div>
    </div>

    <div id="pane-settings" class="pane">
      <div class="panel">
        <h2><i class="fa-solid fa-sliders"></i><span data-i18n="setTitle"></span></h2>
        <div class="set-row">
          <i class="fa-solid fa-volume-high"></i>
          <div><b data-i18n="sndT"></b><small data-i18n="sndD"></small></div>
          <button id="sndToggle" class="toggle on">ON</button>
        </div>
        <div class="set-row">
          <i class="fa-solid fa-circle-info"></i>
          <div><b><span data-i18n="verT"></span> <span id="verNum"></span></b><small id="verMsg"></small></div>
          <button id="btnVer" class="btn sm" style="margin-left:auto" type="button" data-i18n="verBtn"></button>
        </div>
        <div class="set-block">
          <b><i class="fa-solid fa-sliders"></i><span data-i18n="volT"></span></b>
          <input id="volRange" type="range" min="0" max="100" step="5" style="accent-color:var(--sky);padding:0;margin-top:10px">
        </div>
        <div class="set-block">
          <b data-i18n="langT"></b><small data-i18n="langD"></small>
          <select id="langSel"></select>
        </div>
        <div class="set-block">
          <b><i class="fa-solid fa-palette"></i><span data-i18n="themeT"></span></b><small data-i18n="themeD"></small>
          <div id="themeBox" class="themes"></div>
        </div>
        <div class="set-block" id="installBlock">
          <b><i class="fa-solid fa-mobile-screen-button"></i><span data-i18n="instT"></span></b><small data-i18n="instD"></small>
          <div id="instBody"></div>
        </div>
        <div class="set-block">
          <b><i class="fa-solid fa-network-wired"></i><span data-i18n="advT"></span></b><small data-i18n="advD"></small>
          <input id="turnUrl" autocomplete="off" spellcheck="false" data-ph="turnUrlPh">
          <input id="turnUser" autocomplete="off" spellcheck="false" data-ph="turnUserPh">
          <input id="turnCred" type="password" autocomplete="off" data-ph="turnCredPh">
          <p id="turnMsg" class="msg"></p>
        </div>
        <div id="acctSettings">
          <div class="set-block">
            <b><i class="fa-solid fa-face-smile"></i><span data-i18n="photoT"></span></b><small data-i18n="photoD"></small>
            <div class="row" style="margin-top:12px">
              <button id="btnPhoto" class="btn"><i class="fa-solid fa-face-smile"></i><span data-i18n="photoChange"></span></button>
              <button id="btnPhotoDel" class="btn"><i class="fa-solid fa-xmark"></i><span data-i18n="photoRemove"></span></button>
            </div>
          </div>
          <div class="set-block" id="cloudSettings" style="display:none">
            <b><i class="fa-solid fa-key"></i><span data-i18n="pwT"></span></b><small data-i18n="pwD"></small>
            <input id="pwOld" type="password" autocomplete="current-password" data-ph="pwOldPh" maxlength="128">
            <input id="pwNew" type="password" autocomplete="new-password" data-ph="pwNewPh" maxlength="128">
            <button id="btnPw" class="btn grad wide" style="margin-top:14px" type="button" data-i18n="pwBtn"></button>
            <p id="pwMsg" class="msg"></p>
          </div>
          <div class="set-block" id="localProfile">
            <b><i class="fa-solid fa-user-shield"></i><span data-i18n="editT"></span></b>
            <label class="field-label" for="editName" data-i18n="newPseudo"></label>
            <input id="editName" maxlength="16" autocomplete="username">
            <button id="btnSaveProfile" class="btn grad wide" style="margin-top:16px" data-i18n="save"></button>
            <p id="setMsg" class="msg"></p>
          </div>
          <div class="set-block" id="backupBlock">
            <b><i class="fa-solid fa-cloud-arrow-up"></i><span data-i18n="bkT"></span></b><small data-i18n="bkD"></small>
            <label class="field-label" for="bkPass" data-i18n="bkPass"></label>
            <input id="bkPass" type="password" autocomplete="new-password" spellcheck="false">
            <div class="row" style="margin-top:12px">
              <button id="btnBkFile" class="btn"><i class="fa-solid fa-file-arrow-down"></i><span data-i18n="bkFile"></span></button>
              <button id="btnBkCopy" class="btn"><i class="fa-solid fa-copy"></i><span data-i18n="bkCopy"></span></button>
            </div>
            <label class="field-label" for="bkCode" data-i18n="bkImportL"></label>
            <textarea id="bkCode" rows="3" spellcheck="false" autocomplete="off" autocapitalize="off" data-ph="bkCodePh" style="width:100%"></textarea>
            <div class="row" style="margin-top:12px">
              <button id="btnBkPick" class="btn"><i class="fa-solid fa-folder-open"></i><span data-i18n="bkPick"></span></button>
              <button id="btnBkImport" class="btn grad"><i class="fa-solid fa-file-import"></i><span data-i18n="bkImport"></span></button>
            </div>
            <input id="bkFile" type="file" accept=".c02save,.txt,text/plain" hidden>
            <p id="bkMsg" class="msg"></p>
          </div>
          <div class="set-row">
            <i class="fa-solid fa-trash-can" style="color:var(--red)"></i>
            <div><b data-i18n="deleteT"></b><small data-i18n="deleteD"></small></div>
            <button id="btnDelete" class="btn danger sm" style="margin-left:auto" data-i18n="deleteBtn"></button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== Salon : privé ou recherche aléatoire ===== -->
  <section id="lobby" class="view">
    <div class="lobby-card">
      <div id="lobbyIcon" class="mode-ic ic-purple" style="margin:0 auto"><i class="fa-solid fa-tower-broadcast"></i></div>
      <h2 id="lobbyTitle"></h2>
      <p id="lobbyDesc" class="muted" style="margin:0"></p>
      <div id="hostBox">
        <div id="codeBox" class="code">······</div>
        <div class="row">
          <button id="btnCopy" class="btn"><i class="fa-regular fa-copy"></i><span data-i18n="copyCode"></span></button>
          <button id="btnCopyLink" class="btn"><i class="fa-solid fa-link"></i><span data-i18n="copyLink"></span></button>
        </div>
      </div>
      <div class="spin"></div>
      <p id="lobbyMsg" class="msg"></p>
      <div id="lobbyCount" class="count"></div>
      <button class="btn ghost wide" style="margin-top:10px" onclick="location.reload()" data-i18n="cancel"></button>
    </div>
  </section>

  <!-- ===== Placement ===== -->
  <section id="place" class="view">
    <div class="ghead">
      <div id="placeVs" class="vs"></div>
      <button class="btn ghost sm btnQuit"><i class="fa-solid fa-door-open"></i><span data-i18n="quit"></span></button>
    </div>
    <div class="place-wrap">
      <div class="card">
        <div id="placeGrid" class="grid"></div>
      </div>
      <div class="card place-side">
        <h2 data-i18n="placeTitle"></h2>
        <p class="help" data-i18n="placeHelp"></p>
        <p id="rulesInfo" class="help" style="color:var(--sky)"></p>
        <div id="shipList" class="ships"></div>
        <div id="placeBar" class="placebar">
        <div class="tools">
          <button id="btnRotate" class="btn"><i class="fa-solid fa-rotate"></i><span id="rotLbl"></span></button>
          <button id="btnRandom" class="btn"><i class="fa-solid fa-dice"></i><span data-i18n="random"></span></button>
          <button id="btnClear" class="btn"><i class="fa-solid fa-broom"></i><span data-i18n="clear"></span></button>
        </div>
        <div class="row">
          <button id="btnConfirm" class="btn ok"><i class="fa-solid fa-check"></i><span data-i18n="confirm"></span></button>
          <button id="btnRemove" class="btn"><i class="fa-solid fa-xmark"></i><span data-i18n="remove"></span></button>
        </div>
        <p id="placeMsg" class="msg"></p>
        <button id="btnReady" class="btn primary wide" disabled><i class="fa-solid fa-flag-checkered"></i><span data-i18n="ready"></span></button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== Partie ===== -->
  <section id="game" class="view">
    <div class="ghead">
      <div id="gameVs" class="vs"></div>
      <button class="btn ghost sm btnQuit"><i class="fa-solid fa-door-open"></i><span data-i18n="quit"></span></button>
    </div>
    <div id="status" class="status"></div>
    <div id="turnBar" class="turnbar"><i></i></div>
    <div class="game-wrap">
      <div class="card">
        <div class="glabel"><span id="enemyLabel"></span><span id="enemyFleet" class="fleet"></span></div>
        <div id="enemyGrid" class="grid"></div>
        <div id="actBar" class="actbar">
        <div id="modes" class="modes">
          <button data-mode="shot"><i class="ic fa-solid fa-crosshairs"></i><span data-i18n="modeShot"></span></button>
          <button data-mode="radar"><i class="ic fa-solid fa-satellite-dish"></i><span data-i18n="modeRadar"></span><b></b></button>
          <button data-mode="cross"><i class="ic fa-solid fa-plus"></i><span data-i18n="modeCross"></span><b></b></button>
          <button data-mode="shield"><i class="ic fa-solid fa-shield-halved"></i><span data-i18n="modeShield"></span><b></b></button>
        </div>
        <div id="shieldPick" class="shield-pick"></div>
        <div id="overActs" class="overacts">
          <button id="btnBackEnd" class="btn" type="button"><i class="fa-solid fa-trophy"></i><span data-i18n="result"></span></button>
          <button id="btnShare2" class="btn primary" type="button"><i class="fa-solid fa-share-nodes"></i><span data-i18n="shareShort"></span></button>
        </div>
        <p id="hint" class="hint"></p>
        </div>
        <p id="log" class="log"></p>
      </div>
      <div class="card">
        <div class="glabel small-label"><span data-i18n="myFleet"></span></div>
        <div id="myGrid" class="grid small"></div>
      </div>
    </div>
  </section>
</div>

<!-- Rejoindre -->
<div id="joinModal" class="overlay">
  <div class="modal">
    <div class="mode-ic ic-yellow" style="margin:0 0 14px"><i class="fa-solid fa-right-to-bracket"></i></div>
    <h2 data-i18n="mJoinT"></h2>
    <p class="sub" data-i18n="mJoinD"></p>
    <input id="codeInput" maxlength="6" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="CODE">
    <p id="joinMsg" class="msg"></p>
    <button id="btnJoin" class="btn primary wide" data-i18n="btnJoin"></button>
    <button id="btnJoinCancel" class="btn ghost wide" data-i18n="cancel"></button>
  </div>
</div>

<!-- Choix de l'avatar (emoji) -->
<div id="emojiModal" class="overlay">
  <div class="modal">
    <h2 data-i18n="emojiPick"></h2>
    <p class="sub" data-i18n="emojiNote"></p>
    <div id="emojiGrid" class="emoji-grid"></div>
    <button id="btnEmojiCancel" class="btn ghost wide" data-i18n="cancel"></button>
  </div>
</div>

<!-- Choix d'amélioration -->
<div id="choice" class="overlay">
  <div class="modal">
    <h2 data-i18n="choiceTitle"></h2>
    <p id="choiceSub" class="sub"></p>
    <div id="choiceList"></div>
  </div>
</div>

<div id="updBar" class="upd-bar" role="status" style="display:none"><span id="updTxt"></span><button id="btnUpd" class="btn primary" type="button" data-i18n="updBtn"></button></div>

<div id="rotateLock" class="rotate-lock" role="alert"><i class="fa-solid fa-mobile-screen-button"></i><div data-i18n="rotateT"></div><small data-i18n="rotateD"></small></div>

<!-- Fin de partie -->
<div id="end" class="overlay">
  <div class="modal center">
    <div id="endIcon" class="big"></div>
    <h2 id="endTitle"></h2>
    <p id="endText" class="sub"></p>
    <p id="verifyNote" class="verify"></p>
    <div id="endXp"></div>
    <button id="btnRematch" class="btn primary wide" style="margin-top:12px" type="button"><i class="fa-solid fa-rotate-right"></i><span data-i18n="rematch"></span></button>
    <p id="rematchNote"></p>
    <button id="btnShare" class="btn wide" style="margin-top:8px" type="button"><i class="fa-solid fa-share-nodes"></i><span data-i18n="share"></span></button>
    <p id="shareMsg" class="msg"></p>
    <button id="btnNewGame" class="btn wide" style="margin-top:8px" type="button" data-i18n="newGame"></button>
    <button id="btnSeeGrids" class="btn ghost wide" data-i18n="seeGrids"></button>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<!-- Code du jeu, chargé dans l'ordre (scripts classiques : les déclarations sont partagées entre fichiers) -->
<script src="js/lang/pt.js"></script>
<script src="js/lang/es.js"></script>
<script src="js/lang/de.js"></script>
<script src="js/lang/it.js"></script>
<script src="js/i18n.js"></script>
<script src="js/core.js"></script>
<script src="js/sound.js"></script>
<script src="js/profile.js"></script>
<script src="js/net.js"></script>
<script src="js/bot.js"></script>
<script src="js/place.js"></script>
<script src="js/game.js"></script>
<script src="js/share.js"></script>
<script src="js/main.js"></script>
</body>
</html>
