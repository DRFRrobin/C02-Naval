/* =========================================================
   Réseau (PeerJS / WebRTC)
   ========================================================= */
function netErrorText(err) {
  switch (err && err.type) {
    case 'browser-incompatible': return t('errBrowser');
    case 'network': case 'server-error': case 'socket-error': case 'socket-closed': return t('errNet');
    default: return t('errNetOther', { type: (err && err.type) || '?' });
  }
}
function checkPeerLib(where) {
  if (typeof Peer === 'undefined') { msg(where, t('errPeerLib'), true); return false; }
  return true;
}
function keepPeerAlive(peer) {
  // Lien perdu avec le service de mise en relation (veille, réseau) : on se réenregistre
  // pour que le code reste valable tant que l'adversaire n'est pas arrivé.
  if (S.connected || peer.destroyed) return;
  msg('lobbyMsg', t('reconnecting'));
  setTimeout(() => { if (!S.connected && !peer.destroyed && peer.disconnected) peer.reconnect(); }, 1000);
}
function setupLobby(kind) {
  const host = kind === 'host';
  $('hostBox').style.display = host ? '' : 'none';
  $('lobbyIcon').className = 'mode-ic ' + (host ? 'ic-purple' : 'ic-cyan');
  $('lobbyIcon').innerHTML = `<i class="fa-solid ${host ? 'fa-tower-broadcast' : 'fa-shuffle'}"></i>`;
  $('lobbyTitle').textContent = t(host ? 'lobbyHostT' : 'lobbyRandomT');
  $('lobbyDesc').textContent = t(host ? 'lobbyHostD' : 'lobbyRandomD');
  $('lobbyCount').textContent = '';
  msg('lobbyMsg', t(host ? 'creating' : 'searching'));
  showView('lobby');
}
function acceptConn(conn) {
  if (S.connected && S.sid) return acceptResume(conn);   // partie en cours : seule une reprise de CETTE partie est acceptée
  if (S.conn || S.connected) {          // déjà un adversaire : on refuse poliment
    conn.on('open', () => { try { conn.send({ t: 'busy' }); } catch (e) {} setTimeout(() => conn.close(), 300); });
    return;
  }
  setupConn(conn, () => { S.conn = null; if (!S.connected) msg('lobbyMsg', t('waitingOpp')); });
}

// Salon privé
function hostGame() {
  if (!checkPeerLib('dashMsg')) return;
  S.kind = 'host'; S.isHost = true; S.code = genCode(); S.phase = 'lobby';
  applyConfig(RULES);
  setupLobby('host');
  $('codeBox').textContent = S.code;
  const peer = new Peer(PREFIX + S.code, peerOpts());
  S.peer = peer;
  peer.on('open', () => msg('lobbyMsg', t('waitingOpp')));
  peer.on('disconnected', () => keepPeerAlive(peer));
  peer.on('connection', acceptConn);
  peer.on('error', err => {
    if (err.type === 'unavailable-id') { peer.destroy(); hostGame(); return; }  // code déjà pris : on en tire un autre
    if (S.connected) return;
    msg('lobbyMsg', netErrorText(err), true);
  });
}

// Rejoindre avec un code
function openJoin(code) {
  $('codeInput').value = (code || '').toUpperCase().slice(0, 6);
  msg('joinMsg', '');
  $('btnJoin').disabled = false;
  $('joinModal').classList.add('show');
  setTimeout(() => $('codeInput').focus(), 50);
}
function joinGame() {
  if (S.peer) return;
  const code = $('codeInput').value.toUpperCase().replace(/\s+/g, '');
  if (code.length !== 6) return msg('joinMsg', t('errCodeLen'), true);
  if ([...code].some(ch => !ALPHA.includes(ch))) return msg('joinMsg', t('errCodeChars'), true);
  if (!checkPeerLib('joinMsg')) return;
  msg('joinMsg', t('connecting'));
  $('btnJoin').disabled = true;
  S.kind = 'join'; S.isHost = false;
  applyConfig(DEFAULT_RULES);
  const peer = new Peer(peerOpts());
  S.peer = peer; S.code = code;
  let failed = false;
  const fail = text => {
    clearTimeout(S.joinTimer);
    if (S.connected || failed) return;
    failed = true;
    try { peer.destroy(); } catch (e) {}
    S.peer = null; S.conn = null;
    $('btnJoin').disabled = false;
    msg('joinMsg', text, true);
  };
  peer.on('open', () => {
    setupConn(peer.connect(PREFIX + code, { reliable: true }), busy => fail(busy ? t('errFull') : t('errJoinTimeout')));
    S.joinTimer = setTimeout(() => fail(t('errJoinTimeout')), JOIN_TIMEOUT_MS);
  });
  peer.on('error', err => {
    if (S.connected) return;
    fail(err.type === 'peer-unavailable' ? t('errNoGame') : netErrorText(err));
  });
}

// Adversaire aléatoire : quelques « créneaux » publics. On essaie d'en occuper un (on attend),
// et s'il est déjà pris, quelqu'un y attend : on le rejoint. Bot au bout de 45 s.
function findRandom() {
  if (!checkPeerLib('dashMsg')) return;
  S.kind = 'random'; S.phase = 'lobby'; S.mmStopped = false;
  applyConfig(DEFAULT_RULES);
  setupLobby('random');
  const deadline = Date.now() + MM_WAIT_MS;
  const tick = () => {
    if (S.connected) { clearInterval(S.mmTimer); $('lobbyCount').textContent = ''; return; }
    const left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    $('lobbyCount').textContent = t('countdown', { s: left });
    if (left <= 0) {
      clearInterval(S.mmTimer);
      stopSearch();
      if (!settings.bot) { msg('lobbyMsg', t('noBotMsg'), true); setTimeout(() => location.reload(), 2500); return; }
      msg('lobbyMsg', t('noOneFound'), 'ok');
      setTimeout(() => startBot(true), 1000);
    }
  };
  tick(); S.mmTimer = setInterval(tick, 250);
  trySlot(0);
}
function stopSearch() {
  S.mmStopped = true;
  const c = S.conn, p = S.peer;
  S.conn = null; S.peer = null;
  try { if (c) c.close(); } catch (e) {}
  try { if (p) p.destroy(); } catch (e) {}
}
function trySlot(k) {
  if (S.connected || S.mmStopped) return;
  if (k >= MM_SLOTS) { setTimeout(() => trySlot(0), 1500); return; }
  const peer = new Peer(MM_PREFIX + k, peerOpts());
  S.peer = peer;
  peer.on('open', () => { if (S.mmStopped) return peer.destroy(); S.isHost = true; msg('lobbyMsg', t('waitingOpp')); });
  peer.on('connection', conn => { if (!S.mmStopped) acceptConn(conn); });
  peer.on('disconnected', () => keepPeerAlive(peer));
  peer.on('error', err => {
    if (S.connected || S.mmStopped || S.peer !== peer) return;
    if (err.type === 'unavailable-id') { peer.destroy(); joinSlot(k); return; }
    msg('lobbyMsg', netErrorText(err), true);
  });
}
function joinSlot(k) {
  if (S.connected || S.mmStopped) return;
  const peer = new Peer(peerOpts());
  S.peer = peer; S.isHost = false;
  let done = false, tm = null;
  const next = () => {
    if (done || S.connected || S.mmStopped) return;
    done = true; clearTimeout(tm);
    S.conn = null;
    try { peer.destroy(); } catch (e) {}
    trySlot(k + 1);
  };
  peer.on('open', () => {
    if (S.mmStopped) return peer.destroy();
    setupConn(peer.connect(MM_PREFIX + k, { reliable: true }), next);
    tm = setTimeout(() => { if (!S.connected) next(); }, 8000);
  });
  peer.on('error', () => { if (!S.connected) next(); });
}

// Connexion de données commune. La partie démarre quand chacun a reçu le « hello » de l'autre.
function setupConn(conn, onFail) {
  S.conn = conn; S.onReject = onFail || null;
  conn.on('open', () => {
    if (S.conn !== conn) return;
    const extra = {};
    if (S.isHost && S.kind !== 'join') {       // l'hôte annonce la partie : règles, identifiant de partie et point de reprise
      S.sid = S.sid || genCode() + genCode();
      S.rid = S.rid || (S.kind === 'host' ? PREFIX + S.code : PREFIX + genCode());
      Object.assign(extra, { sid: S.sid, rid: S.rid });
      if (S.kind === 'host') extra.rules = CFG;
    }
    send({ t: 'hello', ...myIdentity(), ...extra });
  });
  conn.on('data', m => { if (S.conn === conn) onData(m); });
  const closed = () => {
    if (S.conn !== conn) return;
    if (S.connected) connDown();
    else if (S.onReject) S.onReject(false);
  };
  conn.on('close', closed);
  conn.on('error', closed);
}
function onConnected() {
  S.connected = true;
  clearTimeout(S.joinTimer); clearInterval(S.mmTimer);
  $('joinModal').classList.remove('show');
  S.lastSeen = Date.now();
  S.hb = setInterval(() => {
    send({ t: 'ping', a: S.rxn });
    if (S.reconnecting) { if (Date.now() > S.reconDeadline) lost(); return; }
    // Adversaire parti dans une autre appli ou écran éteint : on lui laisse plus de temps.
    if (Date.now() - S.lastSeen > (S.oppAway ? AWAY_TIMEOUT_MS : TIMEOUT_MS)) connDown();
  }, HEARTBEAT_MS);
  // Créneau aléatoire : on le libère pour le prochain joueur (la liaison directe reste ouverte).
  // L'hôte ouvre en plus un point de rendez-vous privé pour une éventuelle reprise après coupure.
  if (S.kind === 'random' && S.peer) try { S.peer.disconnect(); } catch (e) {}
  if (S.kind === 'random' && S.isHost && S.rid && typeof Peer !== 'undefined') {
    try {
      const rp = new Peer(S.rid, peerOpts());
      S.rpeer = rp;
      rp.on('connection', acceptResume);
      rp.on('disconnected', () => { if (!rp.destroyed) setTimeout(() => { try { rp.reconnect(); } catch (e) {} }, 1000); });
      rp.on('error', () => {});
    } catch (e) {}
  }
  keepAwake();
  enterPlacement();
}

/* ---------- Envoi fiable : messages numérotés, renvoyés après une coupure ---------- */
function send(m) {
  try {
    if (S.vsBot) { if (S.bot) S.bot.receive(m); return; }
    if (SEQ.has(m.t)) { m.n = ++S.txn; S.outbox.push(m); }
    if (S.conn && S.conn.open && !S.reconnecting) S.conn.send(m);
  } catch (e) {}
}
function flushOutbox(theirRx) {
  S.outbox = S.outbox.filter(x => x.n > theirRx);
  for (const m of S.outbox) { try { S.conn.send(m); } catch (e) {} }
}

/* ---------- Reprise après coupure (45 s) ---------- */
function connDown() {
  if (!S.connected || S.lost || S.phase === 'over' || S.vsBot || S.reconnecting) return;
  if (!S.sid || (!S.isHost && !S.hostId)) return lost();   // adversaire sans reprise possible
  S.reconnecting = true; S.reconDeadline = Date.now() + RECONNECT_MS;
  try { if (S.conn && S.conn.close) S.conn.close(); } catch (e) {}
  clearInterval(S.reconTimer); S.reconTimer = setInterval(reconTick, 3000);
  renderConn(); reconTick();
}
function reconTick() {
  if (!S.reconnecting) return;
  if (Date.now() > S.reconDeadline) return lost();
  if (S.isHost) {   // l'hôte reste joignable : on s'assure que son point de rendez-vous est bien enregistré
    const pr = S.rpeer || S.peer;
    try { if (pr && pr.disconnected && !pr.destroyed) pr.reconnect(); } catch (e) {}
  } else guestAttempt();
}
function guestAttempt() {
  if (S.attempting || typeof Peer === 'undefined') return;
  S.attempting = true;
  try { if (S.gpeer) S.gpeer.destroy(); } catch (e) {}
  let peer; try { peer = new Peer(peerOpts()); } catch (e) { S.attempting = false; return; }
  S.gpeer = peer;
  let iv = null;
  const end = () => { clearTimeout(to); clearInterval(iv); S.attempting = false; };
  const to = setTimeout(() => { try { peer.destroy(); } catch (e) {} end(); }, 8000);
  peer.on('error', end);
  peer.on('open', () => {
    const c = peer.connect(S.hostId, { reliable: true });
    const ask = () => { try { if (c.open) c.send({ t: 'resume', sid: S.sid, rx: S.rxn }); } catch (e) {} };
    c.on('open', () => { ask(); iv = setInterval(ask, 1500); });   // la demande est répétée tant qu'aucune réponse n'arrive
    c.on('data', m => { if (m && m.t === 'resume' && m.sid === S.sid && S.reconnecting) { end(); adoptConn(c, m.rx); } });
    c.on('close', end); c.on('error', end);
  });
}
function acceptResume(conn) {   // côté hôte : un invité demande à reprendre la partie
  let adopted = false;
  conn.on('data', m => {
    if (adopted) return;   // une fois adoptée, la connexion est gérée par adoptConn
    if (!m || m.t !== 'resume' || !S.sid || m.sid !== S.sid || !S.connected || S.lost || S.phase === 'over') { try { conn.close(); } catch (e) {} return; }
    adopted = true;
    try { conn.send({ t: 'resume', sid: S.sid, rx: S.rxn }); } catch (e) {}
    adoptConn(conn, m.rx);
  });
}
function adoptConn(conn, theirRx) {
  const old = S.conn; S.conn = conn;
  if (old && old !== conn) try { old.close(); } catch (e) {}
  conn.on('data', m => { if (S.conn === conn) onData(m); });
  const closed = () => { if (S.conn === conn) connDown(); };
  conn.on('close', closed); conn.on('error', closed);
  S.reconnecting = false; clearInterval(S.reconTimer);
  S.lastSeen = Date.now(); S.oppAway = false;
  flushOutbox(Number.isInteger(theirRx) ? theirRx : 0);
  renderConn();
}
function renderConn() {
  if (S.phase === 'game') renderGame();
  else if (S.phase === 'place') { if (S.reconnecting) msg('placeMsg', t('reconnecting')); else { msg('placeMsg', ''); renderPlace(); } }
}

function lost() {
  if (!S.connected || S.lost || S.phase === 'over') return;
  recordInterrupted();
  S.lost = true; S.phase = 'over'; S.reconnecting = false;
  clearInterval(S.hb); clearInterval(S.reconTimer); clearInterval(S.turnTimer);
  $('choice').classList.remove('show');
  $('endIcon').textContent = '📴';
  $('endTitle').textContent = t('lostTitle');
  $('endText').textContent = t('lostText');
  $('endXp').innerHTML = '';
  $('end').classList.add('show');
  if ($('game').classList.contains('active')) renderGame();
}
function quitGame() {
  if (!confirm(t('quitConfirm'))) return;
  recordInterrupted();
  S.phase = 'over';
  if (!S.vsBot) { send({ t: 'quit' }); S.reconnecting = false; }
  if (S.bot) S.bot.stop();
  // Petit délai pour que le message d'abandon parte avant la fermeture du lien.
  setTimeout(() => {
    try { if (S.conn && S.conn.close) S.conn.close(); } catch (e) {}
    location.reload();
  }, S.vsBot ? 0 : 250);
}

/* Veille et arrière-plan */
async function keepAwake() {
  // Empêche l'écran de s'éteindre pendant la partie (navigateurs récents, en HTTPS ou localhost).
  try {
    if (!('wakeLock' in navigator) || S.wakeLock || document.visibilityState !== 'visible') return;
    S.wakeLock = await navigator.wakeLock.request('screen');
    S.wakeLock.addEventListener('release', () => { S.wakeLock = null; });
  } catch (e) { S.wakeLock = null; }
}
function onVisibility() {
  if (!S.connected || S.vsBot || S.lost || S.phase === 'over') return;
  if (document.visibilityState === 'hidden') { send({ t: 'away' }); return; }
  // De retour : nos minuteurs ont pu être ralentis, on repart d'un délai neuf avant de juger la liaison.
  S.lastSeen = Date.now();
  send({ t: 'back' });
  keepAwake();
}
function showAway() {
  if (S.phase === 'game') return renderHint();
  if (S.phase === 'place') {
    if (S.oppAway) msg('placeMsg', t('oppAway'));
    else renderPlace();
  }
}

function onData(m) {
  S.lastSeen = Date.now();
  if (!m || typeof m !== 'object' || S.lost) return;
  if (Number.isInteger(m.n)) {            // message numéroté : on ignore les doublons (renvoi après coupure)
    if (m.n <= S.rxn) return;
    S.rxn = m.n;
  }
  switch (m.t) {
    case 'ping': if (Number.isInteger(m.a)) S.outbox = S.outbox.filter(x => x.n > m.a); break;
    case 'hello':
      S.opp = {
        name: String(m.name || '?').slice(0, 16),
        emoji: validEmoji(m.emoji) ? m.emoji : null,
        level: Math.max(0, Math.min(999, parseInt(m.level, 10) || 0)),
        bot: !!m.bot && S.vsBot,
      };
      if (!S.connected && !S.isHost && !S.vsBot && typeof m.sid === 'string' && typeof m.rid === 'string' && m.sid.length <= 40 && m.rid.length <= 60) { S.sid = m.sid; S.hostId = m.rid; }
      if (!S.connected && S.kind === 'join') applyConfig(sanitizeRules(m.rules) || DEFAULT_RULES);
      if (!S.connected) onConnected(); else renderVs();
      break;
    case 'busy': if (!S.connected && S.onReject) S.onReject(true); break;
    case 'away': S.oppAway = true; showAway(); break;
    case 'back': S.oppAway = false; showAway(); break;
    case 'ready': S.oppReady = true; renderPlace(); maybeStart(); break;
    case 'act': onAct(m); break;
    case 'res': onRes(m); break;
    case 'pass': onPass(); break;
    case 'quit':
      if (S.phase === 'game') endGame(true, true);
      else lost();
      break;
  }
}

/* =========================================================
   Bot tactique : il calcule, pour chaque case, combien de positions
   de bateaux restants y passent (et privilégie celles qui prolongent
   un coup au but), puis tire sur la case la plus probable.
   ========================================================= */
let BOT_SPEED = 1;   // 1 = délais naturels ; réduit par les tests automatiques
class Bot {
  constructor() {
    this.ships = randomCells(LENS).map((cells, i) => ({ i, len: LENS[i], cells, shield: 'none' }));
    this.incoming = Array(N * N).fill(null);
    this.know = Array(N * N).fill(null);   // ce que le bot sait de ta grille : null | miss | hit | sunk | blocked
    this.remaining = LENS.slice();
    this.timers = [];
    this.skill = settings.skill;
  }
  later(fn, ms) { this.timers.push(setTimeout(() => { if (S.vsBot && S.phase !== 'over') fn(); }, ms * BOT_SPEED)); }
  emit(m, ms) { this.later(() => onData(m), ms); }
  start() {
    this.emit({ t: 'hello', name: t('botName'), emoji: '🤖', level: myIdentity().level || 1, bot: true }, 10);
    this.emit({ t: 'ready' }, 900 + Math.random() * 900);
  }
  receive(m) {
    if (m.t === 'act') {
      const a = normalizeAct(m, true); if (!a) return;
      const { kind, cells } = a;
      const { results, over } = resolveOn(this.ships, this.incoming, kind, cells);
      this.emit({ t: 'res', kind, at: a.at, results, over }, 450);
      if (!over) this.later(() => this.move(), 450 + 700 + Math.random() * 600);
    } else if (m.t === 'pass') {
      this.later(() => this.move(), 900);
    } else if (m.t === 'res') {
      for (const x of (m.results || [])) {
        const k = x.r * N + x.c;
        if (x.v === 'sunk') {
          (x.ship || []).forEach(([r, c]) => { this.know[r * N + c] = 'sunk'; });
          const idx = this.remaining.indexOf((x.ship || []).length);
          if (idx >= 0) this.remaining.splice(idx, 1);
        } else if (x.v === 'miss' || x.v === 'hit' || x.v === 'blocked') this.know[k] = x.v;
      }
    }
  }
  move() {
    if (S.phase !== 'game') return;
    const [r, c] = this.choose();
    onData({ t: 'act', kind: 'shot', at: [r, c], cells: [[r, c]] });
  }
  randomUnknown() {
    const free = []; this.know.forEach((v, k) => { if (v === null) free.push(k); });
    const k = free[Math.floor(Math.random() * free.length)];
    return [Math.floor(k / N), k % N];
  }
  choose() {
    const K = this.know;
    if (this.skill === 0) {   // facile : tirs au hasard, avec un peu de bon sens autour d'un touché
      const near = [];
      K.forEach((v, k) => { if (v !== 'hit') return; const r = Math.floor(k / N), c = k % N;
        [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]].forEach(([a, b]) => { if (inside(a, b) && K[a * N + b] === null) near.push([a, b]); }); });
      if (near.length && Math.random() < 0.6) return near[Math.floor(Math.random() * near.length)];
      return this.randomUnknown();
    }
    if (this.skill === 1 && Math.random() < 0.3) return this.randomUnknown();
    const blocked = K.map((v, k) => (v === 'blocked' ? k : -1)).filter(k => k >= 0);
    if (blocked.length) { const k = blocked[0]; return [Math.floor(k / N), k % N]; }   // bouclier : on retire au même endroit
    const hasHits = K.includes('hit');
    const score = Array(N * N).fill(0);
    for (const len of this.remaining) {
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) for (const h of [true, false]) {
        const cells = []; let ok = true, nh = 0;
        for (let i = 0; i < len; i++) {
          const rr = r + (h ? 0 : i), cc = c + (h ? i : 0);
          if (!inside(rr, cc)) { ok = false; break; }
          const v = K[rr * N + cc];
          if (v === 'miss' || v === 'sunk') { ok = false; break; }
          if (v === 'hit') nh++;
          cells.push(rr * N + cc);
        }
        if (!ok || (hasHits && !nh)) continue;
        const w = hasHits ? Math.pow(12, nh) : 1;
        cells.forEach(k => { if (K[k] === null) score[k] += w; });
      }
    }
    let best = -1, bestK = -1;
    for (let k = 0; k < N * N; k++) {
      if (K[k] !== null) continue;
      const parity = !hasHits && ((Math.floor(k / N) + k % N) % 2 === 0) ? 1.25 : 1;
      const v = score[k] * parity + Math.random() * 0.5;
      if (v > best) { best = v; bestK = k; }
    }
    if (bestK < 0) bestK = K.indexOf(null);
    return [Math.floor(bestK / N), bestK % N];
  }
  stop() { this.timers.forEach(clearTimeout); }
}
function startBot(fromRandom) {
  if (!settings.bot) return;
  applyConfig(fromRandom ? DEFAULT_RULES : RULES);
  S.kind = 'bot'; S.vsBot = true; S.isHost = true;
  S.bot = new Bot();
  S.connected = true;
  S.opp = { name: t('botName'), emoji: '🤖', level: myIdentity().level || 1, bot: true };
  enterPlacement();
  S.bot.start();
}

/* =========================================================
   Placement : aperçu, confirmation, glisser-déposer, pivoter
   ========================================================= */
function enterPlacement() {
  S.phase = 'place';
  $('rulesInfo').textContent = t('rulesInfo', { size: N, n: LENS.length, up: anyUpgrade() }) + (CFG.timer ? ' ' + t('placeLimit', { s: PLACE_LIMIT_MS / 1000 }) : '');
  S.placeDeadline = CFG.timer ? Date.now() + PLACE_LIMIT_MS : 0;
  if (S.placeDeadline) {
    clearInterval(S.turnTimer);
    S.turnTimer = setInterval(() => {
      if (S.phase !== 'place') return clearInterval(S.turnTimer);
      if (!S.meReady && !S.reconnecting && Date.now() > S.placeDeadline) {   // temps écoulé : les bateaux restants sont posés au hasard
        settleLifted();
        fillMissingShips();
        setReady();
      }
    }, 1000);
  }
  S.sel = 0; S.preview = null;
  renderVs();
  showView('place');
  renderPlace();
  Snd.play('start');
}
// Pose au hasard les bateaux manquants autour de ceux déjà placés (sinon, flotte entièrement aléatoire).
function fillMissingShips() {
  for (let a = 0; a < 100; a++) {
    const ships = S.ships.map(sh => ({ len: sh.len, cells: sh.cells }));
    let ok = true;
    for (const sh of ships) {
      if (sh.cells) continue;
      const occ = occOf(ships);
      for (let tr = 0; tr < 200 && !sh.cells; tr++) {
        const h = Math.random() < 0.5, r = Math.floor(Math.random() * N), c = Math.floor(Math.random() * N), cells = [];
        for (let i = 0; i < sh.len; i++) {
          const rr = r + (h ? 0 : i), cc = c + (h ? i : 0);
          if (!inside(rr, cc) || occ[rr * N + cc] !== -1) break;
          cells.push([rr, cc]);
        }
        if (cells.length === sh.len) sh.cells = cells;
      }
      if (!sh.cells) { ok = false; break; }
    }
    if (ok) { S.ships.forEach((sh, i) => { sh.cells = ships[i].cells; }); return; }
  }
  randomCells(LENS).forEach((cells, i) => { S.ships[i].cells = cells; });
}
const nextUnplaced = () => S.ships.findIndex(s => !s.cells);
const shipHoriz = cells => cells.length < 2 || cells[0][0] === cells[1][0];

// Cases de l'aperçu (fantôme) du bateau sélectionné, et validité de la position.
function previewInfo() {
  if (!S.preview || S.sel < 0) return null;
  const s = S.ships[S.sel], { r, c, h } = S.preview, occ = occupancy();
  const cells = [];
  let valid = true;
  for (let i = 0; i < s.len; i++) {
    const rr = r + (h ? 0 : i), cc = c + (h ? i : 0);
    if (!inside(rr, cc)) { valid = false; continue; }
    if (occ[rr * N + cc] !== -1) valid = false;
    cells.push([rr, cc]);
  }
  return { cells, valid };
}
const placeHint = (text, err) => msg('placeMsg', text, err);

// Termine le déplacement d'un bateau soulevé : on le pose à l'aperçu si possible, sinon on le remet.
function settleLifted() {
  if (!S.lifted) return;
  const s = S.ships[S.lifted.idx];
  if (!s.cells) {
    const pv = S.sel === S.lifted.idx ? previewInfo() : null;
    s.cells = pv && pv.valid ? pv.cells : S.lifted.cells;
  }
  S.lifted = null; S.preview = null;
}
function selectShip(i) {
  if (S.meReady) return;
  if (S.lifted && S.lifted.idx === i) return;
  settleLifted();
  S.sel = i;
  const s = S.ships[i];
  if (s.cells) {
    // Bateau déjà posé : on le soulève pour pouvoir le déplacer, le pivoter ou le retirer.
    S.lifted = { idx: i, cells: s.cells };
    S.preview = { r: s.cells[0][0], c: s.cells[0][1], h: shipHoriz(s.cells) };
    S.horiz = S.preview.h;
    s.cells = null;
    placeHint(t('pSelPlaced', { ship: shipName(i) }));
  } else {
    S.preview = null;
    placeHint(t('pSelNew', { ship: shipName(i) }));
  }
  Snd.play('click');
  renderPlace();
}
function confirmPlacement() {
  const pv = previewInfo();
  if (!pv) return;
  if (!pv.valid) return placeHint(t('pBad'), true);
  const s = S.ships[S.sel];
  s.cells = pv.cells;
  S.lifted = null; S.preview = null;
  S.sel = nextUnplaced();
  placeHint(S.sel >= 0 ? t('pPlacedNext', { ship: shipName(s.i), next: shipName(S.sel) }) : t('pDone'), S.sel >= 0 ? '' : 'ok');
  Snd.play('place');
  renderPlace();
}
function tapPlaceCell(r, c) {
  if (S.meReady) return;
  const pv = previewInfo();
  if (pv && pv.cells.some(([a, b]) => a === r && b === c)) return confirmPlacement();   // toucher le fantôme le pose
  const idx = occupancy()[r * N + c];
  if (idx >= 0) return selectShip(idx);
  if (S.sel < 0 || (S.ships[S.sel].cells && !(S.lifted && S.lifted.idx === S.sel))) {
    S.sel = nextUnplaced();
    if (S.sel < 0) return placeHint(t('pAllPlaced'));
  }
  S.preview = { r, c, h: S.preview ? S.preview.h : S.horiz };
  const np = previewInfo();
  placeHint(np.valid ? t('pTapGhost') : t('pNoFit'), !np.valid);
  Snd.play('click');
  renderPlace();
}
function rotateShip() {
  if (S.meReady) return;
  if (S.preview) {
    S.preview.h = !S.preview.h;
    if (!previewInfo().valid) {   // s'il sort de la grille en pivotant, on le recale à l'intérieur
      const s = S.ships[S.sel];
      if (S.preview.h) S.preview.c = Math.min(S.preview.c, N - s.len); else S.preview.r = Math.min(S.preview.r, N - s.len);
    }
    const p2 = previewInfo();
    placeHint(p2.valid ? '' : t('pBlocked'), !p2.valid);
  }
  S.horiz = S.preview ? S.preview.h : !S.horiz;
  Snd.play('click');
  renderPlace();
}
function removeShip() {
  if (S.meReady || !S.lifted) return;
  const i = S.lifted.idx;
  S.lifted = null; S.preview = null;
  placeHint(t('pRemoved', { ship: shipName(i) }));
  renderPlace();
}
function clearFleet() {
  if (S.meReady) return;
  S.ships.forEach(s => { s.cells = null; });
  S.lifted = null; S.preview = null; S.sel = 0;
  placeHint(t('pCleared'));
  renderPlace();
}
function randomFleet() {
  if (S.meReady) return;
  S.lifted = null; S.preview = null;
  randomCells(LENS).forEach((cells, i) => { S.ships[i].cells = cells; });
  S.sel = -1;
  placeHint(t('pRandom'));
  Snd.play('place');
  renderPlace();
}
function setReady() {
  if (S.meReady || nextUnplaced() !== -1 || S.lifted) return;
  S.meReady = true; S.sel = -1; S.preview = null;
  send({ t: 'ready' });
  Snd.play('click');
  renderPlace();
  maybeStart();
}

// Glisser-déposer (souris et doigt) sur la grille de placement.
function placeCellAt(x, y) {
  const el = document.elementFromPoint(x, y);
  const d = el && el.closest && el.closest('#placeGrid .cell');
  return d ? [+d.dataset.r, +d.dataset.c] : null;
}
function onPlaceDown(e) {
  if (S.meReady || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const p = placeCellAt(e.clientX, e.clientY); if (!p) return;
  const [r, c] = p;
  const pv = previewInfo();
  const onPreview = !!pv && pv.cells.some(([a, b]) => a === r && b === c);
  const idx = occupancy()[r * N + c];
  S.drag = { r, c, moved: false, ship: false, wasSelected: onPreview };
  if (idx >= 0 && !onPreview) { selectShip(idx); S.drag.ship = true; }   // soulève le bateau touché
  else if (onPreview) S.drag.ship = true;
  if (S.drag.ship) S.drag.off = [r - S.preview.r, c - S.preview.c];
  try { $('placeGrid').setPointerCapture(e.pointerId); } catch (_) {}
  e.preventDefault();
}
function onPlaceMove(e) {
  const d = S.drag; if (!d || !d.ship || !S.preview) return;
  const p = placeCellAt(e.clientX, e.clientY); if (!p) return;
  if (p[0] === d.r && p[1] === d.c && !d.moved) return;
  d.moved = true;
  S.preview.r = p[0] - d.off[0]; S.preview.c = p[1] - d.off[1];
  const pv = previewInfo();
  placeHint(pv.valid ? t('pRelease') : t('pNotHere'), !pv.valid);
  renderPlace();
}
function onPlaceUp() {
  const d = S.drag; S.drag = null;
  if (!d) return;
  if (d.ship && d.moved) {
    const pv = previewInfo();
    if (pv && pv.valid) return confirmPlacement();
    const i = S.sel;   // position refusée : on remet le bateau à sa place d'origine
    if (S.lifted) { S.ships[S.lifted.idx].cells = S.lifted.cells; S.lifted = null; S.preview = null; }
    placeHint(t('pRestored', { ship: i >= 0 ? shipName(i) : '' }), true);
    return renderPlace();
  }
  if (d.ship && !d.wasSelected) return;   // simple appui sur un bateau posé : il reste sélectionné
  tapPlaceCell(d.r, d.c);
}

function renderPlace() {
  if (S.phase !== 'place') return;
  const occ = occupancy(), pv = previewInfo();
  const pvSet = new Set(pv ? pv.cells.map(([r, c]) => r * N + c) : []);
  $('placeGrid').cells.forEach((d, k) => {
    let cls = 'cell';
    if (pvSet.has(k)) cls += pv.valid ? ' pv-ok' : ' pv-bad';
    else if (occ[k] >= 0) cls += ' ship';
    d.className = cls;
  });
  $('shipList').innerHTML = '';
  S.ships.forEach((s, i) => {
    const b = document.createElement('button');
    const placed = !!s.cells || (S.lifted && S.lifted.idx === i);
    b.className = 'shipbtn' + (i === S.sel && !S.meReady ? ' sel' : '') + (placed ? ' placed' : '');
    b.innerHTML = `<span>${esc(shipName(i))}</span><span class="blocks">${'<i></i>'.repeat(s.len)}</span>`;
    b.disabled = S.meReady;
    b.onclick = () => selectShip(i);
    $('shipList').appendChild(b);
  });
  const complete = nextUnplaced() === -1 && !S.lifted;
  $('btnReady').disabled = !complete || S.meReady;
  $('btnRandom').disabled = $('btnRotate').disabled = $('btnClear').disabled = S.meReady;
  $('btnConfirm').disabled = S.meReady || !pv || !pv.valid;
  $('btnRemove').disabled = S.meReady || !S.lifted;
  $('rotLbl').textContent = t((S.preview ? S.preview.h : S.horiz) ? 'rotH' : 'rotV');
  if (S.meReady) msg('placeMsg', S.oppReady ? '' : t('waitOppReady'));
  else if (S.oppReady && !$('placeMsg').textContent) msg('placeMsg', t('oppReady'));
}
function maybeStart() {
  if (S.phase !== 'place' || !S.meReady || !S.oppReady) return;
  S.phase = 'game';
  S.myTurn = S.isHost; S.turnStart = Date.now();
  S.match.start = Date.now();
  startTurnTimer();
  showView('game');
  setLog(t(S.isHost ? 'startHost' : 'startGuest'));
  Snd.play(S.myTurn ? 'turn' : 'start');
  renderGame();
}

/* =========================================================
   Partie
   ========================================================= */
function sanitizeCells(list) {
  return (Array.isArray(list) ? list : [])
    .filter(p => Array.isArray(p) && Number.isInteger(p[0]) && Number.isInteger(p[1]) && inside(p[0], p[1]))
    .slice(0, 5);
}
// Normalise une action reçue : un tir = 1 case, un radar = carré 2 × 2, une frappe en croix = 5 cases.
// Une amélioration non gagnée est ramenée à un simple tir (anti-triche et robustesse).
function normalizeAct(m, canUpgrade) {
  const raw = sanitizeCells(m.cells);
  const okPt = Array.isArray(m.at) && Number.isInteger(m.at[0]) && Number.isInteger(m.at[1]) && inside(m.at[0], m.at[1]);
  const at = okPt ? [m.at[0], m.at[1]] : (raw[0] || null);
  if (!at) return null;
  let kind = ['shot', 'cross', 'radar'].includes(m.kind) ? m.kind : 'shot';
  if (kind !== 'shot' && (!canUpgrade || !upgradeOn(kind))) kind = 'shot';
  const [r, c] = at;
  const allowed = kind === 'radar' ? [[r, c], [r, c + 1], [r + 1, c], [r + 1, c + 1]]
    : kind === 'cross' ? [[r, c], [r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]] : [[r, c]];
  let cells = raw.filter(([a, b]) => allowed.some(([x, y]) => x === a && y === b));
  cells = cells.filter((p, i) => cells.findIndex(q => q[0] === p[0] && q[1] === p[1]) === i);
  if (!cells.length) cells = [at];
  return { kind, at, cells };
}
// Calcule le résultat de tirs sur une flotte (la sienne ou celle du bot).
function resolveOn(ships, incoming, kind, cells) {
  const occ = occOf(ships), results = [];
  for (const [r, c] of cells) {
    const k = r * N + c, i = occ[k];
    if (kind === 'radar') { results.push({ r, c, v: i >= 0 ? 'occ' : 'empty' }); continue; }
    if (incoming[k] === 'miss' || incoming[k] === 'hit') { results.push({ r, c, v: incoming[k] }); continue; }
    if (i < 0) { incoming[k] = 'miss'; results.push({ r, c, v: 'miss' }); continue; }
    const s = ships[i];
    if (s.shield === 'active') { s.shield = 'used'; incoming[k] = 'blocked'; results.push({ r, c, v: 'blocked' }); continue; }
    incoming[k] = 'hit';
    results.push(sunkOf(s, incoming) ? { r, c, v: 'sunk', ship: s.cells, si: i } : { r, c, v: 'hit' });
  }
  return { results, over: ships.every(s => sunkOf(s, incoming)) };
}

/* ---------- Chronomètre de tour (règle facultative) ---------- */
function startTurnTimer() {
  clearInterval(S.turnTimer);
  if (!CFG.timer) return;
  S.turnTimer = setInterval(() => {
    if (S.phase !== 'game') return clearInterval(S.turnTimer);
    if (!S.myTurn || S.waiting || S.reconnecting || $('choice').classList.contains('show')) { if (S.myTurn) S.turnStart = Date.now(); return renderTimer(); }
    if (Date.now() - S.turnStart >= CFG.timer * 1000) return autoShot();
    renderTimer();
  }, 500);
}
function renderTimer() {
  if (S.phase !== 'game' || !CFG.timer || !S.myTurn || S.waiting || S.reconnecting) return;
  const left = Math.max(0, Math.ceil(CFG.timer - (Date.now() - S.turnStart) / 1000));
  $('status').textContent = t('stMyTurn') + ' · ' + left + ' s';
}
function autoShot() {   // temps écoulé : tir au hasard sur une case encore inconnue
  const free = []; for (let k = 0; k < N * N; k++) if (S.enemy[k] === null) free.push(k);
  if (!free.length) return;
  const k = free[Math.floor(Math.random() * free.length)];
  S.mode = 'shot';
  flashHint(t('autoShot'));
  onEnemyTap(Math.floor(k / N), k % N);
}

/* ---------- Mes actions ---------- */
function onEnemyTap(r, c) {
  if (S.phase !== 'game') return;
  if (!S.myTurn || S.waiting) return flashHint(t(S.waiting ? 'fFiring' : 'fWaitTurn'));
  if (S.mode === 'shield') return flashHint(t('fShieldHere'));
  let cells;
  if (S.mode === 'shot') {
    if (!targetable(r * N + c)) return flashHint(t('fAlready'));
    cells = [[r, c]];
  } else if (S.mode === 'radar') {
    cells = [[r, c], [r, c + 1], [r + 1, c], [r + 1, c + 1]].filter(([a, b]) => inside(a, b) && S.enemy[a * N + b] === null);
    if (!cells.length) return flashHint(t('fNoUnknown'));
    S.inv.radar--; S.match.upgrades++;
  } else if (S.mode === 'cross') {
    cells = [[r, c], [r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]].filter(([a, b]) => inside(a, b) && targetable(a * N + b));
    if (!cells.length) return flashHint(t('fAllKnown'));
    S.inv.cross--; S.match.upgrades++;
  }
  S.pendingAct = { kind: S.mode, at: [r, c] };
  Snd.play(S.mode === 'radar' ? 'radar' : 'shot');
  send({ t: 'act', kind: S.mode, at: [r, c], cells });
  S.waiting = true; S.mode = 'shot';
  renderGame();
}
function onMyTap(r, c) {
  if (S.phase !== 'game' || S.mode !== 'shield' || !S.myTurn || S.waiting) return;
  const idx = occupancy()[r * N + c];
  if (idx < 0) return flashHint(t('fTouchShip'));
  const s = S.ships[idx];
  if (isSunk(s)) return flashHint(t('fShipSunk'));
  if (s.shield !== 'none') return flashHint(t('fHasShield'));
  s.shield = 'active';
  S.inv.shield--; S.match.upgrades++;
  S.mode = 'shot'; S.myTurn = false;
  send({ t: 'pass' });
  Snd.play('shield');
  setLog(t('shieldPlaced', { ship: shipName(idx) }));
  renderGame();
}
function setMode(m) {
  if (S.phase !== 'game' || !S.myTurn || S.waiting) return;
  if (m !== 'shot' && !S.inv[m]) return;
  S.mode = S.mode === m ? 'shot' : m;
  Snd.play('click');
  renderGame();
}

/* ---------- Réponses ---------- */
function summarize(kind, at, results) {
  const cell = cellName(...at);
  if (kind === 'radar') return t('sumRadar', { cell, n: results.filter(x => x.v === 'occ').length, total: results.length });
  const sunkIdx = results.filter(x => x.v === 'sunk').map(x => x.si);
  const sunkNames = sunkIdx.map(i => (Number.isInteger(i) && i >= 0 && i < LENS.length ? shipName(i) : '?'));
  if (kind === 'shot') {
    const v = results[0] && results[0].v;
    return t('sumShot', { cell, v, ship: sunkNames[0] || '' });
  }
  return t('sumCross', {
    cell, hits: results.filter(x => x.v === 'hit' || x.v === 'sunk').length, miss: results.filter(x => x.v === 'miss').length,
    blk: results.filter(x => x.v === 'blocked').length, sunk: sunkNames.join(t('and')), sunkN: sunkNames.length,
  });
}
function playResultSound(results) {
  if (results.some(x => x.v === 'sunk')) { Snd.play('sunk'); Snd.buzz([80, 40, 140]); }
  else if (results.some(x => x.v === 'hit')) { Snd.play('hit'); Snd.buzz(50); }
  else if (results.some(x => x.v === 'blocked')) Snd.play('blocked');
  else if (results.some(x => x.v === 'miss')) Snd.play('miss');
}

// Le défenseur calcule le résultat sur sa propre grille.
function onAct(m) {
  if (S.phase !== 'game' || S.myTurn || S.waiting) return;  // ce n'est pas le tour de l'adversaire
  const a = normalizeAct(m, S.oppUsed < S.ships.filter(isSunk).length);
  if (!a) return;
  const { kind, cells, at } = a;
  if (kind !== 'shot') S.oppUsed++;
  const { results, over } = resolveOn(S.ships, S.incoming, kind, cells);
  send({ t: 'res', kind, at, results, over });
  S.lastIn = kind === 'radar' ? [] : cells.map(([r, c]) => r * N + c);
  setLog(t('oppPrefix', { name: S.opp ? S.opp.name : '?' }) + summarize(kind, at, results), true);
  if (kind === 'radar') Snd.play('radar'); else playResultSound(results);
  if (over) return endGame(false);
  S.myTurn = true; S.waiting = false; S.turnStart = Date.now();
  setTimeout(() => { if (S.myTurn && S.phase === 'game') Snd.play('turn'); }, 500);
  renderGame();
}

// L'attaquant reçoit le résultat.
function onRes(m) {
  if (S.phase !== 'game' || !S.waiting) return;
  const results = (Array.isArray(m.results) ? m.results : []).filter(x => x && inside(x.r, x.c));
  const act = S.pendingAct || { kind: m.kind, at: m.at };
  let sunk = 0;
  for (const x of results) {
    if (x.v === 'sunk') {
      (Array.isArray(x.ship) ? x.ship : [[x.r, x.c]]).forEach(p => { if (Array.isArray(p) && inside(p[0], p[1])) S.enemy[p[0] * N + p[1]] = 'sunk'; });
      if (Number.isInteger(x.si) && x.si >= 0 && x.si < LENS.length && !S.enemySunk.includes(x.si)) S.enemySunk.push(x.si);
      sunk++;
    } else {
      const st = { miss: 'miss', hit: 'hit', blocked: 'blocked', occ: 'scanOcc', empty: 'scanEmpty' }[x.v];
      if (st) S.enemy[x.r * N + x.c] = st;
    }
  }
  if (act.kind !== 'radar') {
    S.match.shots += results.length;
    S.match.hits += results.filter(x => x.v === 'hit' || x.v === 'sunk').length;
    S.match.sunk += sunk;
    playResultSound(results);
  }
  setLog(summarize(act.kind, act.at, results));
  S.waiting = false; S.pendingAct = null;
  if (m.over) return endGame(true);
  S.myTurn = false;
  if (anyUpgrade()) S.choices += sunk;
  renderGame();
  if (S.choices > 0) setTimeout(openChoice, 500);
}
function onPass() {
  if (S.phase !== 'game' || S.myTurn || S.waiting) return;
  if (!CFG.shield || S.oppUsed >= S.ships.filter(isSunk).length) return;   // bouclier non gagné ou désactivé : ignoré
  S.oppUsed++;
  S.myTurn = true; S.turnStart = Date.now();
  S.lastIn = [];
  setLog(t('oppShield', { name: S.opp ? S.opp.name : '?' }), true);
  Snd.play('turn');
  renderGame();
}

/* ---------- Améliorations ---------- */
const UPG = { radar: ['fa-satellite-dish', 'upRadarN', 'upRadarD'], cross: ['fa-plus', 'upCrossN', 'upCrossD'], shield: ['fa-shield-halved', 'upShieldN', 'upShieldD'] };
function openChoice() {
  if (S.phase !== 'game' || S.choices <= 0) { $('choice').classList.remove('show'); return; }
  $('choiceSub').textContent = S.choices > 1 ? t('choiceSubN', { n: S.choices }) : t('choiceSub');
  const list = $('choiceList'); list.innerHTML = '';
  for (const [k, [icon, nk, dk]] of Object.entries(UPG).filter(([k]) => upgradeOn(k))) {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<strong><i class="fa-solid ${icon}" style="color:var(--yellow);margin-right:8px"></i>${esc(t(nk))}</strong><span>${esc(t(dk))}</span>`;
    b.onclick = () => { S.inv[k]++; S.choices--; Snd.play('upgrade'); renderGame(); openChoice(); };
    list.appendChild(b);
  }
  $('choice').classList.add('show');
}

/* ---------- Fin de partie ---------- */
function endGame(win, forfeit) {
  S.phase = 'over'; S.reconnecting = false;
  clearInterval(S.hb); clearInterval(S.reconTimer); clearInterval(S.turnTimer);
  S.myTurn = false; S.waiting = false;
  if (S.bot) S.bot.stop();
  $('choice').classList.remove('show');
  $('endIcon').textContent = win ? '🏆' : '🌊';
  $('endTitle').textContent = t(win ? 'win' : 'lose');
  const acc = S.match.shots ? Math.round(S.match.hits / S.match.shots * 100) : 0;
  $('endText').textContent = t(forfeit ? 'winForfeit' : win ? 'winText' : 'loseText') + ' ' + t('endStats', { shots: S.match.shots, acc });
  const r = recordGame(win);
  if (r) {
    const a = me(), l = levelOf(a.xp), lo = xpFor(l), hi = xpFor(l + 1);
    $('endXp').innerHTML = `<div class="xpgain">+${r.gain} XP</div>`
      + (r.up ? `<div class="lvlup">⬆ ${esc(t('levelUp', { n: r.level, rank: rankOf(r.level) }))}</div>` : '')
      + (S.vsBot ? `<div class="endnote">${esc(t('botXp'))}</div>` : !isStdRules(CFG) ? `<div class="endnote">${esc(t('customXp'))}</div>` : '')
      + `<div class="xpbar"><i style="width:${Math.round((a.xp - lo) / (hi - lo) * 100)}%"></i></div>`
      + `<div class="xprow"><span>XP: <b>${a.xp - lo} / ${hi - lo}</b></span><span>${esc(t('levelN', { n: l }))}</span></div>`;
  } else $('endXp').innerHTML = `<p class="endnote">${esc(t('xpGuest'))}</p>`;
  setTimeout(() => Snd.play(win ? 'win' : 'lose'), 600);
  setTimeout(() => $('end').classList.add('show'), 700);
  renderGame();
}

/* ---------- Affichage de la partie ---------- */
let hintTimer = null;
function flashHint(text) {
  const h = $('hint'); h.textContent = text; h.style.color = '#fca5a5';
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => { h.style.color = ''; renderHint(); }, 1800);
}
function renderHint() {
  if (S.phase === 'game' && S.oppAway) { $('hint').textContent = t('oppAway'); return; }
  const key = { shot: 'hintShot', radar: 'hintRadar', cross: 'hintCross', shield: 'hintShield' }[S.mode];
  $('hint').textContent = (S.phase === 'game' && S.myTurn && !S.waiting) ? t(key) : '';
}
function setLog(text, fromOpp) {
  const l = $('log'); l.textContent = text; l.className = 'log' + (fromOpp ? ' opp' : '');
}
function renderGame() {
  const live = S.phase === 'game' && S.myTurn && !S.waiting;
  const st = $('status');
  if (S.lost) { st.textContent = t('stLost'); st.className = 'status'; }
  else if (S.reconnecting) { st.textContent = t('stReconnecting'); st.className = 'status wait'; }
  else if (S.phase === 'over') { st.textContent = t('stOver'); st.className = 'status'; }
  else if (S.waiting) { st.textContent = t('stFiring'); st.className = 'status wait'; }
  else if (S.myTurn) { st.textContent = t('stMyTurn'); st.className = 'status me'; }
  else { st.textContent = t('stOppTurn'); st.className = 'status'; }

  const SYM = { miss: '•', hit: '✕', sunk: '✕', blocked: '🛡', scanOcc: '?', scanEmpty: '·' };
  const eg = $('enemyGrid');
  eg.classList.toggle('live', live && S.mode !== 'shield');
  eg.cells.forEach((d, k) => {
    const v = S.enemy[k];
    d.className = 'cell' + (v ? ' ' + v : '') + (targetable(k) ? ' target' : '');
    d.textContent = v ? SYM[v] : '';
  });

  const occ = occupancy(), mg = $('myGrid');
  mg.classList.toggle('pick', live && S.mode === 'shield');
  mg.cells.forEach((d, k) => {
    const i = occ[k], v = S.incoming[k];
    let cls = 'cell';
    if (i >= 0) cls += isSunk(S.ships[i]) ? ' sunk' : ' ship';
    if (i >= 0 && S.ships[i].shield === 'active') cls += ' shielded';
    if (v === 'hit' && !(i >= 0 && isSunk(S.ships[i]))) cls += ' hit';
    if (v === 'miss') cls += ' miss';
    if (v === 'blocked') cls += ' blocked';
    if (S.lastIn.includes(k)) cls += ' last';   // dernier tir adverse
    d.className = cls;
    d.textContent = v ? SYM[v] : '';
  });

  $('enemyFleet').innerHTML = LENS.map((_, i) => `<span class="${S.enemySunk.includes(i) ? 'down' : ''}">${esc(shipName(i))}</span>`).join('');

  document.querySelectorAll('#modes button').forEach(b => {
    const m = b.dataset.mode;
    if (m !== 'shot') b.querySelector('b').textContent = S.inv[m] || '';
    b.style.display = m === 'shot' || upgradeOn(m) ? '' : 'none';
    b.disabled = !live || (m !== 'shot' && !S.inv[m]);
    b.classList.toggle('on', live && S.mode === m);
  });
  renderHint();
}

/* =========================================================
   Démarrage
   ========================================================= */
function buildGrids() {
  buildGrid($('placeGrid'), null);
  buildGrid($('enemyGrid'), onEnemyTap);
  buildGrid($('myGrid'), onMyTap);
}
applyConfig(RULES);
const pg = $('placeGrid');
pg.addEventListener('pointerdown', onPlaceDown);
pg.addEventListener('pointermove', onPlaceMove);
pg.addEventListener('pointerup', onPlaceUp);
pg.addEventListener('pointercancel', () => { S.drag = null; });

// Connexion
$('segLogin').onclick = () => { msg('authMsg', ''); openAuth('login'); };
$('segSignup').onclick = () => { msg('authMsg', ''); openAuth('signup'); };
$('btnLogin').onclick = doLogin;
$('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('btnSignup').onclick = doSignup;
$('suPass2').addEventListener('keydown', e => { if (e.key === 'Enter') doSignup(); });
$('btnGuest').onclick = () => { setSession(null); openDash('play'); };

// Tableau de bord
document.querySelectorAll('.tabsnav [data-pane]').forEach(b => { b.onclick = () => { pane = b.dataset.pane; msg('setMsg', ''); Snd.play('click'); renderDash(); }; });
$('btnLogout').onclick = () => { clearSession(); msg('authMsg', ''); openAuth('login'); };
$('avUp').addEventListener('click', e => { e.preventDefault(); pickPhoto(); });
['turnUrl', 'turnUser', 'turnCred'].forEach(id => $(id).addEventListener('change', () => {
  settings.turnUrl = $('turnUrl').value.trim(); settings.turnUser = $('turnUser').value.trim(); settings.turnCred = $('turnCred').value;
  saveSettings(); msg('turnMsg', userTurn() || !settings.turnUrl ? t('turnSaved') : t('errNetOther', { type: 'TURN' }), userTurn() || !settings.turnUrl ? 'ok' : true);
}));
$('btnEmojiCancel').onclick = () => $('emojiModal').classList.remove('show');
$('emojiModal').addEventListener('click', e => { if (e.target === $('emojiModal')) $('emojiModal').classList.remove('show'); });
$('themeBox').addEventListener('click', e => { const b = e.target.closest('[data-th]'); if (!b) return; settings.theme = b.dataset.th; saveSettings(); applyTheme(); renderThemes(); Snd.play('click'); });
$('btnPhoto').onclick = pickPhoto;
$('btnPhotoDel').onclick = () => { loadAccounts(); const a = me(); if (a) { a.emoji = null; saveAccount(a); renderDash(); } };
$('sndToggle').onclick = () => { settings.sound = !settings.sound; saveSettings(); renderSettings(); Snd.play('click'); };
const setLang = v => { settings.lang = I18N[v] ? v : 'fr'; saveSettings(); applyLang(); if ($('dash').classList.contains('active')) renderDash(); else if ($('auth').classList.contains('active')) openAuth(authTab); };
$('langSel').onchange = e => setLang(e.target.value);
$('langMini').onchange = e => setLang(e.target.value);
$('btnSaveProfile').onclick = saveProfile;
$('btnDelete').onclick = deleteAccount;
$('mRandom').onclick = () => { Snd.play('click'); findRandom(); };
$('mBot').onclick = () => { Snd.play('click'); if (!settings.bot) return msg('dashMsg', t('botOff'), true); startBot(); };
$('mJoin').onclick = () => { Snd.play('click'); openJoin(''); };
$('mHost').onclick = () => { Snd.play('click'); hostGame(); };

// Rejoindre
$('btnJoin').onclick = joinGame;
$('btnJoinCancel').onclick = () => {
  if (S.peer && !S.connected) { try { S.peer.destroy(); } catch (e) {} S.peer = null; S.conn = null; clearTimeout(S.joinTimer); }
  $('joinModal').classList.remove('show');
};
$('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') joinGame(); });
$('codeInput').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase(); msg('joinMsg', ''); });

// Salon
const copy = async (text) => {
  try { await navigator.clipboard.writeText(text); msg('lobbyMsg', t('copied'), 'ok'); }
  catch (e) { msg('lobbyMsg', t('copyFail'), true); }
};
$('btnCopy').onclick = () => copy(S.code);
$('btnCopyLink').onclick = () => copy(location.origin + location.pathname + '?code=' + S.code);

// Placement et partie
$('btnRotate').onclick = rotateShip;
$('btnRandom').onclick = randomFleet;
$('btnClear').onclick = clearFleet;
$('btnConfirm').onclick = confirmPlacement;
$('btnRemove').onclick = removeShip;
$('btnReady').onclick = setReady;
document.querySelectorAll('.btnQuit').forEach(b => { b.onclick = quitGame; });
document.querySelectorAll('#modes button').forEach(b => { b.onclick = () => setMode(b.dataset.mode); });
$('btnSeeGrids').onclick = () => $('end').classList.remove('show');

// Raccourcis clavier pendant le placement (PC) : R pivote, Entrée pose, Suppr retire.
document.addEventListener('keydown', e => {
  if (S.phase !== 'place' || e.target.tagName === 'INPUT') return;
  if (e.key === 'r' || e.key === 'R') rotateShip();
  else if (e.key === 'Enter') confirmPlacement();
  else if (e.key === 'Delete' || e.key === 'Backspace') removeShip();
});

// Un autre onglet a modifié les comptes : on rafraîchit l'affichage.
window.addEventListener('storage', e => {
  if (e.key !== null && !e.key.startsWith(STORE_KEY)) return;
  if ($('dash').classList.contains('active')) renderDash();
  else if ($('auth').classList.contains('active')) openAuth(authTab);
});

// Bloque le zoom par pincement (Safari iOS ignore user-scalable=no).
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener('visibilitychange', onVisibility);
window.addEventListener('pagehide', e => {
  if (e.persisted) return;
  try { if (S.conn && S.conn.close) S.conn.close(); } catch (e) {}
  try { if (S.peer) S.peer.destroy(); } catch (e) {}
  try { if (S.rpeer) S.rpeer.destroy(); } catch (e) {}
  try { if (S.gpeer) S.gpeer.destroy(); } catch (e) {}
});

// Lien d'invitation (?code=…) : la fenêtre « Rejoindre » s'ouvre dès qu'on arrive au tableau de bord.
pendingCode = (new URLSearchParams(location.search).get('code') || '').toUpperCase().slice(0, 6) || null;
try { if (pendingCode !== null || location.search) history.replaceState(null, '', location.pathname + location.hash); } catch (e) {}
applyTheme();
applyLang();
loadAccounts();
restoreSession();
// #stats ou #settings dans l'adresse ouvre directement cet onglet.
const startPane = ['play', 'stats', 'rules', 'settings'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'play';
if (loggedIn) openDash(startPane); else openAuth();
</script>
